
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispatch — newsroom intelligence</title>
<style>
/* ============================================================
   Dispatch — "signal room"
   Calm dark canvas. Colour appears only as signal: teal = the
   system, red/amber/green = priority and verification. One bold
   element — the live pipeline. Everything else quiet.
   ============================================================ */
:root{
  /* dark "signal room" — the default */
  --bg:#0D1420; --bg2:#111A28; --surf:#16202F; --surf2:#1C2838; --raise:#22304399;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --ink:#EDF2F9; --ink2:#9DABC2; --ink3:#647591;
  --teal:#43D1C4; --teal-d:#1F8F86; --teal-soft:rgba(67,209,196,.12);
  --red:#FF6B6B; --red-soft:rgba(255,107,107,.13);
  --amber:#F5B84D; --amber-soft:rgba(245,184,77,.13);
  --green:#4ADE94; --green-soft:rgba(74,222,148,.13);
  --violet:#B694FF; --violet-soft:rgba(182,148,255,.14);
  --tier1:#7FB2FF; --tier1-soft:rgba(127,178,255,.14);
  --btn-ink:#04211E;
  --topbar-bg:rgba(13,20,32,.82);
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
:root[data-theme="light"]{
  /* calm daylight — same signal colours, dialled for a white canvas */
  --bg:#F4F6FB; --bg2:#EDF1F8; --surf:#FFFFFF; --surf2:#F0F3F9; --raise:#E7ECF599;
  --line:rgba(16,32,58,.10); --line2:rgba(16,32,58,.18);
  --ink:#16233A; --ink2:#465569; --ink3:#78889E;
  --teal:#0E9E90; --teal-d:#8FD8D0; --teal-soft:rgba(14,158,144,.10);
  --red:#DA3B3B; --red-soft:rgba(218,59,59,.10);
  --amber:#B7791F; --amber-soft:rgba(214,158,46,.16);
  --green:#1F9D57; --green-soft:rgba(31,157,87,.12);
  --violet:#7A5AF0; --violet-soft:rgba(122,90,240,.12);
  --tier1:#2563C9; --tier1-soft:rgba(37,99,201,.10);
  --btn-ink:#FFFFFF;
  --topbar-bg:rgba(244,246,251,.86);
  --shadow:0 1px 2px rgba(16,32,58,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
#app{min-height:100%}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.02em;line-height:1.15}
a{color:var(--teal);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* boot */
.boot{min-height:100vh;display:grid;place-items:center}
.bootcard{text-align:center}
.logo{color:var(--teal)}
.logo.big{font-size:40px;display:block;margin-bottom:10px}
.bootcard h1{font-size:22px}
.bootcard p{color:var(--ink3);margin:6px 0 16px}
.bar{width:220px;height:3px;border-radius:99px;background:var(--surf2);overflow:hidden;margin:0 auto;position:relative}
.bar i{position:absolute;top:0;bottom:0;left:-40%;width:40%;background:var(--teal);border-radius:99px;animation:sweep 1.1s infinite ease-in-out}
@keyframes sweep{0%{left:-40%}100%{left:100%}}

/* top bar */
.bar-top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:22px;
  padding:12px 24px;background:var(--topbar-bg);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body{transition:background .25s ease,color .25s ease}
.lead{display:flex;align-items:baseline;gap:9px}
.lead .logo{font-size:19px}
.name{font-weight:700;font-size:16px;letter-spacing:-.02em}
.tag{color:var(--ink3);font-size:12px}
.nav{display:flex;gap:4px;background:var(--surf);border-radius:9px;padding:3px}
.nb{padding:6px 14px;border-radius:7px;font-size:13px;color:var(--ink2)}
.nb.on{background:var(--surf2);color:var(--ink)}
.live{margin-left:auto;display:flex;align-items:center;gap:10px}
.playbtn{width:30px;height:30px;border-radius:50%;background:var(--teal);color:var(--btn-ink);font-size:11px;
  display:grid;place-items:center;font-weight:700}
.playbtn.on{background:var(--surf2);color:var(--teal)}
.ldot{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 0 var(--teal);animation:beat 1.8s infinite}
.ldot.paused{background:var(--ink3);animation:none}
@keyframes beat{0%{box-shadow:0 0 0 0 rgba(67,209,196,.5)}70%{box-shadow:0 0 0 6px rgba(67,209,196,0)}100%{box-shadow:0 0 0 0 rgba(67,209,196,0)}}
.lclock{font-family:var(--mono);font-size:14px;color:var(--ink2);min-width:42px}
.scrub{-webkit-appearance:none;appearance:none;width:150px;height:4px;border-radius:99px;background:var(--surf2)}
.scrub::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--teal);border:2px solid var(--bg)}
.scrub::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--teal);border:2px solid var(--bg)}

/* ---------- OVERVIEW ---------- */
.ov{max-width:1120px;margin:0 auto;padding:0 24px 70px}

/* hero */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:40px;align-items:center;padding:46px 0 34px}
.herotext h1{font-size:34px;line-height:1.08;max-width:15ch}
.herotext p{margin:16px 0 0;color:var(--ink2);font-size:15px;max-width:52ch;line-height:1.6}
.herostat{background:linear-gradient(160deg,var(--surf),var(--bg2));border:1px solid var(--line);
  border-radius:18px;padding:24px 26px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;position:relative;overflow:hidden}
.herostat::before{content:'';position:absolute;inset:0;background:radial-gradient(120% 80% at 90% 0%,var(--teal-soft),transparent 60%);pointer-events:none}
.hnum{text-align:center}
.hnum b{display:block;font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1}
.hnum span{font-size:12px;color:var(--ink3)}
.hnum.accent b{color:var(--teal)}
.harrow{font-size:24px;color:var(--ink3)}
.hsub{grid-column:1/-1;text-align:center;font-size:11.5px;color:var(--ink3);border-top:1px solid var(--line);padding-top:12px;margin-top:4px}

/* pipeline — the one bold thing */
.pipe{display:flex;align-items:stretch;gap:0;padding:6px 0 4px}
.station{flex:1;background:var(--surf);border:1px solid var(--line);border-radius:14px;
  padding:16px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;
  transition:border-color .18s,transform .18s;min-width:0}
.station:hover{border-color:var(--teal-d);transform:translateY(-2px)}
.station.on{border-color:var(--teal);background:var(--surf2);box-shadow:0 0 0 1px var(--teal-d) inset}
.sicon{width:30px;height:30px;color:var(--teal)}
.sicon svg{width:100%;height:100%}
.sbig{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1}
.sname{font-size:13.5px;font-weight:600}
.ssub{font-size:10.5px;color:var(--ink3);line-height:1.35}
.flow{width:34px;align-self:center;height:2px;background:var(--line2);position:relative;flex:0 0 34px;overflow:hidden;border-radius:2px}
.flow span{position:absolute;top:-1px;left:0;width:8px;height:4px;border-radius:2px;background:var(--teal);opacity:.55}
.flow.run span{animation:dart 1s linear infinite}
@keyframes dart{0%{left:-8px}100%{left:34px}}
.pipehint{text-align:center;color:var(--ink3);font-size:12px;margin:12px 0 0;min-height:16px}

/* stage explainer panel */
.panel{background:var(--surf);border:1px solid var(--teal-d);border-radius:14px;padding:20px 22px;margin:14px 0 6px;
  animation:drop .25s ease}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.panelhead h3{font-size:17px;color:var(--teal)}
.x{font-size:12px;color:var(--ink3);border:1px solid var(--line);border-radius:7px;padding:4px 10px}
.panel p{margin:0 0 14px;color:var(--ink2);font-size:13.5px;max-width:76ch;line-height:1.6}
.panel p b{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.feedchip{font-size:11px;color:var(--ink2);background:var(--surf2);border:1px solid var(--line);border-radius:99px;padding:3px 10px 3px 18px;position:relative}
.feedchip::before{content:'';position:absolute;left:8px;top:50%;transform:translateY(-50%);width:5px;height:5px;border-radius:50%;background:var(--teal)}
.minibars{display:grid;gap:6px;max-width:460px}
.mbar{display:grid;grid-template-columns:110px 1fr auto;align-items:center;gap:10px;font-size:12px}
.mbl{color:var(--ink2)}
.mbar i{height:7px;border-radius:99px;background:var(--teal);opacity:.6}
.mbar b{font-family:var(--mono);color:var(--ink2);font-size:11px}
.tally{display:flex;gap:12px;flex-wrap:wrap}
.ty{background:var(--surf2);border:1px solid var(--line);border-radius:11px;padding:12px 16px;min-width:120px}
.ty b{display:block;font-size:24px;font-weight:700;line-height:1}
.ty span{font-size:11px;color:var(--ink3)}
.ty.red b{color:var(--red)}.ty.amber b{color:var(--amber)}.ty.green b{color:var(--green)}

/* output */
.out{padding:40px 0 6px}
.outhead{margin-bottom:18px}
.outhead h2{font-size:24px}
.outhead p{margin:5px 0 0;color:var(--ink2);font-size:13.5px}
.corstrip{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--amber-soft);
  border:1px solid rgba(245,184,77,.3);border-radius:12px;padding:11px 15px;margin-bottom:18px}
.cflag{font-size:11px;font-weight:700;color:var(--amber);background:rgba(245,184,77,.16);border-radius:6px;padding:3px 9px}
.ctext{flex:1;font-size:12.5px;color:var(--ink2);min-width:200px}
.clink{font-size:12px;color:var(--amber);border:1px solid rgba(245,184,77,.3);border-radius:7px;padding:4px 10px}
.clink:hover{background:rgba(245,184,77,.12)}
.group{margin-bottom:22px}
.grouphead{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
.gflag{font-size:13px;font-weight:700;padding:3px 11px;border-radius:7px}
.g-red .gflag{color:var(--red);background:var(--red-soft)}
.g-amber .gflag{color:var(--amber);background:var(--amber-soft)}
.g-violet .gflag{color:var(--violet);background:var(--violet-soft)}
.gsub{font-size:12px;color:var(--ink3)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:15px 17px;cursor:pointer;
  transition:border-color .16s,transform .16s;position:relative;border-left-width:3px}
.g-red .card{border-left-color:var(--red)}
.g-amber .card{border-left-color:var(--amber)}
.g-violet .card{border-left-color:var(--violet)}
.card:hover{border-color:var(--teal-d);transform:translateY(-2px)}
.cardtop{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.beat{font-size:11px;color:var(--ink3);border:1px solid var(--line);border-radius:5px;padding:1px 7px}
.vchip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px}
.vchip.b-corroborated{color:var(--green);background:var(--green-soft)}
.vchip.b-partly{color:var(--teal);background:var(--teal-soft)}
.vchip.b-unverified{color:var(--violet);background:var(--violet-soft)}
.cortag{font-size:10.5px;font-weight:600;color:var(--amber);background:var(--amber-soft);border-radius:5px;padding:1px 7px}
.card h3{font-size:15.5px;line-height:1.3;margin-bottom:6px}
.why{font-size:12.5px;color:var(--ink2);line-height:1.5}
.gap{margin:8px 0 0;font-size:12px;color:var(--amber);background:var(--amber-soft);border-radius:8px;padding:7px 10px}
.gap b{font-weight:600}
.cardfoot{display:flex;justify-content:space-between;align-items:center;margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
.route{font-size:11.5px;color:var(--ink3)}
.cta{font-size:12px;color:var(--teal);font-weight:600}
.parked{margin:6px 0 0;font-size:12.5px;color:var(--ink3);font-style:italic}

/* impact */
.impact{padding:38px 0 6px}
.impgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.imp{background:linear-gradient(165deg,var(--surf),var(--bg2));border:1px solid var(--line);border-radius:15px;padding:20px}
.imp b{display:block;font-size:34px;font-weight:700;letter-spacing:-.03em;color:var(--teal);line-height:1}
.imp i{font-style:normal;font-size:12px;color:var(--ink);font-weight:600;display:block;margin:6px 0 8px}
.imp p{margin:0;font-size:11.5px;color:var(--ink3);line-height:1.5}
.foot{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink3);text-align:center}

/* ---------- STORY JOURNEY ---------- */
.story{max-width:1080px;margin:0 auto;padding:0 24px 80px}
.storyhead{padding:22px 0 20px;border-bottom:1px solid var(--line)}
.back{font-size:12.5px;color:var(--teal);margin-bottom:12px}
.shrow{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap}
.storyhead h1{font-size:26px;line-height:1.18;max-width:32ch}
.shmeta{margin:8px 0 0;font-size:12px;color:var(--ink3)}
.shgauges{display:flex;gap:14px}
.dial{text-align:center;position:relative}
.dial svg{width:56px;height:56px;transform:rotate(-90deg)}
.dial .dt{fill:none;stroke:var(--surf2);stroke-width:5}
.dial .df{fill:none;stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.dial b{position:absolute;top:19px;left:0;right:0;font-size:15px;font-weight:700}
.dial span{display:block;font-size:10.5px;color:var(--ink3);margin-top:2px}
.dial.b-corroborated .df{stroke:var(--green)}
.dial.b-partly .df{stroke:var(--teal)}
.dial.b-unverified .df{stroke:var(--violet)}
.dial:not(.b-corroborated):not(.b-partly):not(.b-unverified) .df{stroke:var(--teal)}
.shexp{margin:16px 0 0;font-size:13px;color:var(--ink2)}

.journey{display:grid;grid-template-columns:150px 1fr;gap:28px;margin-top:6px}
.rail{position:sticky;top:74px;align-self:start;display:flex;flex-direction:column;gap:2px;padding-top:26px}
.railitem{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;color:var(--ink3);font-size:12.5px}
.railitem:hover{background:var(--surf);color:var(--ink);text-decoration:none}
.rn{width:20px;height:20px;border-radius:50%;background:var(--surf2);color:var(--ink2);display:grid;place-items:center;font-size:11px;font-weight:600;flex:0 0 20px}
.stages{min-width:0}
.stg{padding:24px 0;border-bottom:1px solid var(--line);scroll-margin-top:74px}
.stghead{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}
.stgn{width:30px;height:30px;border-radius:50%;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center;font-weight:700;flex:0 0 30px}
.stghead h2{font-size:19px}
.stghead p{margin:2px 0 0;color:var(--ink3);font-size:12.5px}
.stgnote{margin:12px 0 0;font-size:12px;color:var(--ink3);line-height:1.55;max-width:74ch}

/* gather tape */
.tape{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ti{display:grid;grid-template-columns:48px auto auto 1fr;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);font-size:12.5px}
.ti:last-child{border-bottom:0}
.ti.dup{opacity:.42}
.tt{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.tsrc{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:5px;white-space:nowrap}
.tsrc.s1{color:var(--tier1);background:var(--tier1-soft)}
.tsrc.s2{color:var(--green);background:var(--green-soft)}
.tsrc.s3{color:var(--amber);background:var(--amber-soft)}
.tsrc.s4{color:var(--violet);background:var(--violet-soft)}
.tv{font-size:10px;font-weight:600;padding:1px 7px;border-radius:99px;white-space:nowrap}
.tv.v-new{color:var(--teal);background:var(--teal-soft)}
.tv.v-upd{color:var(--ink2);background:var(--surf2)}
.tv.v-dev{color:var(--green);background:var(--green-soft)}
.tv.v-dup{color:var(--ink3);background:var(--surf2)}
.tv.v-gap{color:var(--amber);background:var(--amber-soft)}
.tv.v-cor{color:var(--red);background:var(--red-soft)}
.tv.v-unv{color:var(--violet);background:var(--violet-soft)}
.th{font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* understand */
.ucards{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ucard{background:var(--surf);border:1px solid var(--line);border-radius:11px;padding:12px 16px;text-align:center}
.ucard b{display:block;font-size:22px;font-weight:700}
.archbox{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.archbox h4{font-size:13px;margin-bottom:8px}
.arch{margin:5px 0;font-size:12.5px}
.arch span{display:block;font-size:11px;color:var(--ink3)}

/* judge */
.judgegrid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-bottom:16px}
.jax h4{font-size:13.5px;margin-bottom:10px}
.brow{background:var(--surf);border-radius:8px;padding:8px 11px;margin-bottom:7px;font-size:11.5px}
.brhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:5px}
.brhead b{font-size:12px;font-weight:600;color:var(--ink)}
.bw{font-style:normal;font-size:10px;font-weight:700;color:var(--ink3);background:var(--surf2);border-radius:4px;padding:1px 6px;white-space:nowrap}
.brbar{position:relative;height:6px;border-radius:4px;background:var(--surf2);overflow:hidden;margin-bottom:5px}
.brbar i{position:absolute;left:0;top:0;bottom:0;background:var(--teal);border-radius:4px}
.brsay{display:block;color:var(--ink2);font-size:11.5px}
.scoreexp{font-size:11.5px;color:var(--ink2);line-height:1.5;margin:0 0 12px;max-width:60ch}
.bandkey{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.morefac{font-size:11px;color:var(--ink3);margin:2px 0 0;line-height:1.5}
.morefac b{color:var(--ink2);font-weight:600}
.bandkey span{font-size:10px;color:var(--ink3);background:var(--surf);border:1px solid var(--line);border-radius:5px;padding:2px 8px}
.credbox{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--surf)}
.credbox.b-corroborated{border-color:rgba(74,222,148,.3)}
.credbox.b-unverified{border-color:rgba(182,148,255,.3)}
.credtop{display:flex;gap:16px;align-items:center;margin-bottom:12px}
.bigconf{text-align:center;flex:0 0 auto}
.bigconf b{display:block;font-size:34px;font-weight:700;line-height:1}
.bigconf span{font-size:11px;color:var(--ink3)}
.b-corroborated .bigconf b{color:var(--green)}
.b-partly .bigconf b{color:var(--teal)}
.b-unverified .bigconf b{color:var(--violet)}
.credtop p{margin:0;font-size:12.5px;color:var(--ink2);line-height:1.55}
.risks{list-style:none;margin:0 0 10px;padding:0}
.risks li{padding:8px 0;border-top:1px solid var(--line);font-size:12px;color:var(--ink2);line-height:1.5}
.risks li span{display:inline-block;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;margin-right:7px;text-transform:uppercase;letter-spacing:.03em}
.r-high span{color:var(--red);background:var(--red-soft)}
.r-medium span{color:var(--amber);background:var(--amber-soft)}
.r-low span{color:var(--ink3);background:var(--surf2)}
.onecall{margin:8px 0 0;font-size:12.5px;color:var(--teal);background:var(--teal-soft);border-radius:8px;padding:9px 12px;line-height:1.5}
.ocl{display:block;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px}

/* ==== engine ==== */
/* ============================================================
   News Hunt — Input Desk
   engine.js  ·  the part that has to be real
   ------------------------------------------------------------
   One structure, the story graph. Every requirement in the
   brief is a query against it rather than a separate feature.

   Nothing here calls a model. Clustering, dedup, scoring,
   credibility and routing are deterministic and inspectable,
   which is what makes the "why" line trustworthy. A model
   belongs at draft time only, over a fixed claim set.
   ============================================================ */

/* ---------------------------------------------------------
   1 · Normalisation
   Indian-desk reality: the same entity arrives under several
   surface forms, across scripts. Without this layer dedup
   fails silently, which is worse than not deduping at all.
--------------------------------------------------------- */
const ALIASES = {
  'bangalore':'bengaluru', 'bengaluru':'bengaluru', 'blr':'bengaluru',
  'bombay':'mumbai', 'calcutta':'kolkata', 'madras':'chennai',
  'gurgaon':'gurugram', 'poona':'pune', 'baroda':'vadodara',
  'nammametro':'namma metro', 'bmrcl':'namma metro',
  'pm modi':'narendra modi', 'modi':'narendra modi', 'pm':'narendra modi',
  'stalin':'mk stalin', 'mkstalin':'mk stalin',
  'tvk':'vijay', 'thalapathy':'vijay',
  'rbi':'reserve bank of india', 'reserve bank':'reserve bank of india',
  'mpc':'monetary policy committee',
  'crr':'cash reserve ratio',
  'ndrf':'national disaster response force',
  'pg':'paying guest', 'payingguest':'paying guest',
  'mp':'madhya pradesh',
  'ddu hospital':'deen dayal upadhyay hospital',
  'hooch':'spurious liquor', 'liquor':'spurious liquor',
  'collapse':'collapse', 'derail':'derailment', 'derailed':'derailment',
  'chopper':'helicopter'
};

const STOP = new Set(('a an the and or but of in on at to for from by with as is are was were be been '+
  'has have had say said says will would can could after over into out up down about more most new '+
  'that this these those it its his her their they we you i he she also than then so such very just '+
  'per cent tuesday monday wednesday thursday friday saturday sunday today yesterday').split(' '));

function alias(s) { return ALIASES[s] || s; }

function tokenise(text) {
  const raw = String(text || '')
    .toLowerCase()
    .replace(/[\u2018\u2019\u201c\u201d]/g, '')
    .replace(/[^a-z0-9\u0900-\u097F\u0B80-\u0BFF ]+/g, ' ')
    .split(/\s+/)
    .filter(Boolean);
  const out = new Set();
  for (const w of raw) {
    if (STOP.has(w) || w.length < 3) continue;
    out.add(alias(w));
  }
  return out;
}

function normEntity(e) {
  const k = String(e || '').toLowerCase().trim();
  return alias(k);
}

function jaccard(a, b) {
  if (!a.size || !b.size) return 0;
  let hits = 0;
  for (const v of a) if (b.has(v)) hits++;
  return hits / (a.size + b.size - hits);
}

/* ---------------------------------------------------------
   2 · Item preparation
--------------------------------------------------------- */
function prepare(item) {
  const src = SOURCES[item.source] || { label: item.source, kind: 'unknown', tier: 4, trust: 0.2, rights: 'unknown' };
  return {
    ...item,
    src,
    tokens: tokenise(item.headline + ' ' + item.body),
    entitySet: new Set((item.entities || []).map(normEntity)),
    claims: item.claims || [],
    claimKeys: new Set((item.claims || []).map(c => c.key)),
    assets: item.assets || { photo:0, video:0, live:false },
    flags: item.flags || [],
    socialVolume: item.socialVolume || 0
  };
}

/* ---------------------------------------------------------
   3 · Cluster resolution
   Text similarity alone breaks across languages, so entity
   overlap is weighted at least as heavily. A Hindi wire take
   and an English one on the same event share entities even
   when they share no tokens.
--------------------------------------------------------- */
const MATCH_FLOOR   = 0.24;   // live event clustering
const RELATED_FLOOR = 0.16;   // looser, for archive context
const COVERED_FLOOR = 0.42;   // "we have already published this"

function overlapCount(a, b) { let n = 0; for (const v of a) if (b.has(v)) n++; return n; }

/* An entity anchor is what stops "Delhi" on its own from
   welding unrelated stories together. Similarity is necessary
   but not sufficient. */
function eligible(item, m) {
  const ents = overlapCount(item.entitySet, m.entitySet);
  if (ents >= 2) return true;
  return ents >= 1 && jaccard(item.tokens, m.tokens) >= 0.35;
}

function matchScore(item, cluster, opts = {}) {
  let best = 0, bestOn = null;
  for (const m of cluster.items) {
    if (!opts.loose && !eligible(item, m)) continue;
    const tx = jaccard(item.tokens, m.tokens);
    const en = jaccard(item.entitySet, m.entitySet);
    const ck = jaccard(item.claimKeys, m.claimKeys);
    const s = 0.34 * tx + 0.48 * en + 0.18 * ck;
    if (s > best) { best = s; bestOn = m.id; }
  }
  return { score: best, on: bestOn };
}

/* ---------------------------------------------------------
   4 · What kind of arrival is this
   The brief asks for duplicate / update / new development /
   enrichment as separate outcomes. They are all one test:
   does this item carry a claim key the cluster does not
   already hold, and does that key change the story's state.
--------------------------------------------------------- */
const STATE_KEYS = new Set(['toll','injured','arrests','rescued','cause','decision','denial',
  'probe','accountability','casualties','compensation','impact','licensing']);

function classify(item, cluster) {
  if (!cluster) return { type:'NEW', label:'New story', newKeys:[...item.claimKeys], note:'No existing cluster matched this arrival.' };

  const held = cluster.claimIndex;
  const newKeys = [];
  const changed = [];
  for (const c of item.claims) {
    if (!held.has(c.key)) newKeys.push(c.key);
    else {
      const existing = held.get(c.key);
      const differs = ![...existing.values].includes(c.value);
      if (differs) changed.push(c.key);
    }
  }

  if (item.flags.includes('correction'))
    return { type:'CORRECTION', label:'Correction', newKeys, changed,
             note:'Wire correction. Any published copy carrying the earlier figure needs updating now.' };

  const isRival = item.src.kind === 'competitor';

  if (!newKeys.length && !changed.length)
    return { type:'DUPLICATE', label:'Duplicate', newKeys, changed,
             note: isRival ? 'Same facts we already hold. No enrichment here.'
                           : 'Adds no claim the cluster does not already hold. Collapsed.' };

  if (isRival) {
    const gained = [...new Set([...newKeys, ...changed])];
    return { type:'ENRICH', label:'Rival has more', newKeys, changed,
             note:`${item.src.label} is carrying ${gained.join(', ')} and we are not. Needs our own confirmation before use.` };
  }

  const stateful = [...newKeys, ...changed].some(k => STATE_KEYS.has(k));

  /* A tier-4 account introducing a casualty figure nobody else
     has is not a development. It is a claim to check. */
  if (stateful && item.src.tier >= 4) {
    const co = corroboration(cluster);
    if (!co.official || co.count < 2)
      return { type:'UNVERIFIED', label:'Unverified claim', newKeys, changed,
               note:`Open-social account is first with ${[...new Set([...newKeys,...changed])].join(', ')}. Nothing else on the tape carries it.` };
  }
  if (stateful)
    return { type:'DEVELOPMENT', label:'New development', newKeys, changed,
             note:`Changes the state of the story: ${[...new Set([...newKeys, ...changed])].join(', ')}.` };

  return { type:'UPDATE', label:'Update', newKeys, changed,
           note:`Adds detail to a story we already hold: ${newKeys.join(', ') || changed.join(', ')}.` };
}

/* ---------------------------------------------------------
   5 · The graph
--------------------------------------------------------- */
function newGraph() {
  return { clusters: [], seq: 1, arrivals: [], overrides: [], beatBias: {}, archive: [] };
}

/* Our own back catalogue is not part of the live event graph.
   It hangs off clusters as context and as the answer to
   "have we already published this?". Folding a two-year-old
   investigation into a breaking event as if it were another
   sighting is a real editorial error, not a cosmetic one. */
function loadArchive(graph, rows) {
  graph.archive = rows.map(prepare);
}

function attachArchive(graph, cluster) {
  const rel = [];
  for (const a of graph.archive) {
    let best = 0;
    for (const m of cluster.items) {
      if (overlapCount(a.entitySet, m.entitySet) < 2) continue;
      const s = 0.34 * jaccard(a.tokens, m.tokens) + 0.48 * jaccard(a.entitySet, m.entitySet) + 0.18 * jaccard(a.claimKeys, m.claimKeys);
      if (s > best) best = s;
    }
    if (best >= RELATED_FLOOR) rel.push({ item: a, score: best });
  }
  rel.sort((x, y) => y.score - x.score);
  cluster.related = rel;

  /* Similarity alone is not coverage. An old audit piece about
     the same building is context; it is not us having filed on
     today's collapse. Require a shared event-defining claim. */
  const evt = cluster.claimIndex.get('event');
  cluster.published = rel.filter(r => {
    if (r.score < COVERED_FLOOR) return false;
    if (!evt) return false;
    return r.item.claims.some(c => c.key === 'event' && evt.values.has(c.value));
  });
}

function reindex(cluster) {
  const idx = new Map();
  for (const it of cluster.items) {
    for (const c of it.claims) {
      if (!idx.has(c.key)) idx.set(c.key, { values:new Set(), texts:[], sources:new Set() });
      const e = idx.get(c.key);
      e.values.add(c.value);
      const rec = { text:c.text, itemId:it.id, source:it.source, value:c.value };
      for (const k in c) if (k.indexOf('text_') === 0) rec[k] = c[k];  // carry hi/bn/ml phrasings
      e.texts.push(rec);
      e.sources.add(it.source);
    }
  }
  cluster.claimIndex = idx;
}

function ingest(graph, rawItem, now) {
  const item = prepare(rawItem);
  item.arrivedAt = now;

  let best = null, bestScore = 0, on = null;
  for (const c of graph.clusters) {
    const m = matchScore(item, c);
    if (m.score > bestScore) { bestScore = m.score; best = c; on = m.on; }
  }
  const matched = bestScore >= MATCH_FLOOR ? best : null;
  const verdict = classify(item, matched);
  verdict.similarity = bestScore;
  verdict.matchedOn = on;
  item.verdict = verdict;

  let cluster = matched;
  if (!cluster) {
    cluster = {
      id: 'C' + (graph.seq++),
      title: rawItem.headline,
      beat: rawItem.beat,
      items: [],
      firstSeen: now,
      lastSeen: now,
      claimIndex: new Map(),
      status: 'open',
      owner: null,
      routingOverride: null,
      log: []
    };
    graph.clusters.push(cluster);
  }

  cluster.items.push(item);
  cluster.lastSeen = now;
  /* Wire and official copy carry publishable headlines. A
     reporter's filing note does not; it is an internal memo. */
  const labelWorthy = ['wire','official'].includes(item.src.kind)
    && rawItem.lang === 'en'
    && !item.flags.includes('embargo') && !item.flags.includes('correction');
  const advances = verdict.type === 'DEVELOPMENT' || verdict.type === 'CORRECTION';
  if (labelWorthy && (!cluster.titleLocked || advances)) {
    cluster.title = rawItem.headline.replace(/^(CORRECTED|EMBARGOED):\s*/, '');
    cluster.titleLocked = true;
  }
  reindex(cluster);
  attachArchive(graph, cluster);
  graph.arrivals.push({ item, cluster, verdict, at: now });
  return { item, cluster, verdict };
}

/* ---------------------------------------------------------
   5b · Whose number wins
   Claim values arrive in the order they were posted, and the
   loudest account is often first. Any figure that reaches copy
   or a headline has to come from the most trustworthy source
   carrying it, with a wire correction outranking everything.
--------------------------------------------------------- */
function bestValue(cluster, key) {
  const entry = cluster.claimIndex.get(key);
  if (!entry) return null;
  let best = null, bestRank = -1;
  for (const t of entry.texts) {
    const it = cluster.items.find(x => x.id === t.itemId);
    if (!it) continue;
    if (!USABLE.has(it.src.kind)) continue;
    const rank = it.src.trust
      + (it.flags.includes('correction') ? 0.5 : 0)
      + (it.src.kind === 'reporter' ? 0.08 : 0)
      + it.arrivedAt / 1e7;
    if (rank > bestRank) { bestRank = rank; best = { value: t.value, text: t.text, itemId: t.itemId, source: t.source }; }
  }
  if (best) return best;
  const t = entry.texts[entry.texts.length - 1];
  return { value: t.value, text: t.text, itemId: t.itemId, source: t.source, unusable: true };
}

/* ---------------------------------------------------------
   6 · Independent corroboration
   Two wires running the same PTI-derived line are not two
   sources. Count organisations, and count social separately.
--------------------------------------------------------- */
function corroboration(cluster) {
  const orgs = new Set(), social = new Set(), rivals = new Set();
  let ownStaff = false, official = false;
  for (const it of cluster.items) {
    if (it.src.kind === 'trends') { continue; }   // demand-side signal, not a source
    if (it.src.kind === 'social') { social.add(it.source); continue; }
    if (it.src.kind === 'competitor') { rivals.add(it.source); continue; }
    orgs.add(it.source);
    if (it.src.kind === 'reporter' || it.src.kind === 'stringer') ownStaff = true;
    if (it.src.kind === 'official') official = true;
  }
  return { orgs:[...orgs], social:[...social], rivals:[...rivals], ownStaff, official, count:orgs.size };
}

/* ---------------------------------------------------------
   7 · Importance and urgency, kept apart
   A cabinet reshuffle is important and not urgent. A viral
   clip is urgent and not important. Collapsing them into one
   number is how triage tools end up ignored.
--------------------------------------------------------- */
const BEAT_WEIGHT = { metro:0.92, politics:0.85, business:0.80, world:0.62, sport:0.40, education:0.22, entertainment:0.35 };
const IMPACT_KEYS = { toll:1, casualties:0.5, injured:0.55, trapped:0.7, occupants:0.5,
  arrests:0.35, compensation:0.4, impact:0.5, decision:0.7, crr:0.6 };

function magnitude(cluster) {
  let m = 0, evidence = [];
  for (const [key, entry] of cluster.claimIndex) {
    const w = IMPACT_KEYS[key];
    if (!w) continue;
    const bv = bestValue(cluster, key);
    const num = bv ? parseFloat(String(bv.value).replace(/[^0-9.]/g, '')) : NaN;
    const n = isNaN(num) ? 0 : num;
    const scaled = n > 0 ? Math.min(1, Math.log10(n + 1) / 2.2) : 0.45;
    const c = w * scaled;
    if (c > 0) evidence.push({ key, value: bv ? bv.value : [...entry.values][0], contribution:c });
    m = Math.max(m, c);
  }
  return { value: Math.min(1, m), evidence };
}

const IMPACT_LABEL = { toll:'death toll', injured:'injured', rescued:'rescued', trapped:'people trapped',
  casualties:'casualties', missing:'missing', growth:'growth forecast', crr:'CRR change',
  decision:'policy decision', magnitude:'scale' };
const impactLabel = k => IMPACT_LABEL[k] || k;

function importance(cluster, graph) {
  const co = corroboration(cluster);
  const authority = Math.max(0, ...cluster.items.map(i => i.src.trust));
  const corrob = Math.min(1, co.count / 3);
  const mag = magnitude(cluster);
  const prox = BEAT_WEIGHT[cluster.beat] ?? 0.5;
  const totalKeys = cluster.claimIndex.size;
  const novelty = Math.min(1, totalKeys / 8);
  const bias = (graph && graph.beatBias[cluster.beat]) || 0;

  const parts = [
    { name:'Source authority',  w:0.20, v:authority,  say:`strongest source: ${cluster.items.reduce((a,b)=>b.src.trust>a.src.trust?b:a).src.label}` },
    { name:'Corroboration',     w:0.25, v:corrob,     say:`${co.count} independent ${co.count===1?'organisation':'organisations'} carrying it` },
    { name:'Human impact',      w:0.30, v:mag.value,  say: mag.evidence.length ? `${cap(impactLabel(mag.evidence[0].key))}: ${mag.evidence[0].value}` : 'no hard impact figure yet' },
    { name:'Beat weight',       w:0.15, v:prox,       say:`${cap(cluster.beat)} desk` },
    { name:'Claim depth',       w:0.10, v:novelty,    say:`${totalKeys} distinct facts on the story` }
  ];
  let score = parts.reduce((s,p) => s + p.w * p.v, 0) + bias;
  score = Math.max(0, Math.min(1, score));
  return { value: Math.round(score * 100), parts, magnitude: mag, corroboration: co, biased: bias !== 0 };
}

function urgency(cluster, now, graph) {
  const win = 240;
  const recent = cluster.items.filter(i => now - i.arrivedAt <= win);
  const recentOrgs = new Set(recent.filter(i => i.src.kind !== 'social').map(i => i.source));
  const velocity = Math.min(1, recentOrgs.size / 3);

  const half = cluster.items.filter(i => now - i.arrivedAt <= win/2)
    .reduce((s,i) => s + i.socialVolume, 0);
  const older = cluster.items.filter(i => now - i.arrivedAt > win/2 && now - i.arrivedAt <= win)
    .reduce((s,i) => s + i.socialVolume, 0);
  const socialLift = Math.min(1, (half - older) / 3000 + (half > 0 ? 0.15 : 0));

  const ours = (cluster.published || []);
  const rivalPub = cluster.items.filter(i => i.src.kind === 'competitor')
    .sort((a,b) => a.arrivedAt - b.arrivedAt)[0];
  let compClock = 0, compSay = 'no rival has filed';
  if (rivalPub && !ours.length) {
    const mins = (now - rivalPub.arrivedAt) / 60;
    compClock = Math.min(1, 0.35 + mins / 12);
    compSay = `${rivalPub.src.label} filed ${fmtMin(mins)} ago, we have nothing out`;
  } else if (rivalPub && ours.length) {
    compSay = 'we already have copy live on this';
    compClock = 0.15;
  }

  const recentCorrection = cluster.items.some(i =>
    i.flags && i.flags.includes('correction') && (now - i.arrivedAt) <= 300);
  const live = cluster.items.some(i => i.assets.live) ? 1 : 0;
  const developing = cluster.claimIndex.has('toll') || cluster.claimIndex.has('trapped') || cluster.claimIndex.has('rescued');
  const settled = cluster.claimIndex.has('decision') && !developing;
  const perish = recentCorrection ? 1 : live ? 1 : developing ? 0.85
    : settled ? 0.2 : (cluster.beat === 'education' ? 0.15 : 0.5);

  /* A settled decision also stops accruing urgency from the last
     burst of near-identical wire takes. The story is done moving. */
  const velEff = settled ? Math.min(velocity, 0.3) : velocity;

  const parts = [
    { name:'New sources arriving', w:0.35, v: Math.max(velEff, recentCorrection ? 0.85 : 0),
      say: recentCorrection ? 'a correction just landed — published copy may be wrong'
        : `${recentOrgs.size} new ${recentOrgs.size===1?'source':'sources'} in the last ${win/60} min` },
    { name:'Attention climbing',   w:0.20, v:Math.max(0,socialLift), say: half ? `~${Math.round(half)} posts in the last ${win/120} min` : 'no rise in search or social' },
    { name:'Rival clock',          w:0.30, v:compClock,  say: compSay },
    { name:'Goes stale fast',      w:0.15, v: recentCorrection ? 1 : perish,
      say: recentCorrection ? 'correction must reach readers now' : live ? 'live, unfolding event' : developing ? 'figures still moving' : 'holds its value' }
  ];
  const score = Math.max(0, Math.min(1, parts.reduce((s,p) => s + p.w * p.v, 0)));
  return { value: Math.round(score * 100), parts, rivalFirst: rivalPub || null, weOut: ours.length > 0 };
}

function fmtMin(m) {
  if (m < 1) return Math.round(m * 60) + 's';
  return Math.round(m) + ' min';
}

/* The one line an editor actually reads. Built from the two
   highest contributors on each axis, never generic. */
function why(imp, urg) {
  const top = arr => arr.slice().sort((a,b) => b.w*b.v - a.w*a.v).filter(p => p.v > 0.15).slice(0,2);
  const bits = [...top(urg.parts), ...top(imp.parts)].map(p => p.say);
  const seen = new Set(); const out = [];
  for (const b of bits) { if (!seen.has(b)) { seen.add(b); out.push(b); } }
  return out.slice(0,3).join('. ') + '.';
}

/* ---------------------------------------------------------
   8 · Credibility
   Never returns a verdict on truth. Returns what is thin,
   and the single call that would settle it.
--------------------------------------------------------- */
const HEDGES = /\b(reportedly|reported to|sources say|it is said|claimed|allegedly|feared|unconfirmed|kaha ja raha|said to be|apparently)\b/gi;
const WHO_TO_ASK = {
  'delhi police':'Delhi Police PRO', 'dwarka':'DCP Dwarka', 'namma metro':'BMRCL corporate communications',
  'indian railways':'Divisional Railway Manager, Itarsi', 'derailment':'West Central Railway CPRO',
  'spurious liquor':'district excise officer', 'madhya pradesh':'Bhopal district collectorate (the local administration)',
  'reserve bank of india':'RBI communications', 'malaysia':'Malaysian civil aviation authority',
  'dmk':'DMK spokesperson', 'vijay':'TVK media cell'
};

function credibility(cluster) {
  const co = corroboration(cluster);
  const authority = Math.max(0, ...cluster.items.map(i => i.src.trust));
  const risks = [];

  const bodyAll = cluster.items.map(i => i.headline + ' ' + i.body).join(' ');
  const words = bodyAll.split(/\s+/).length;
  const hedgeHits = (bodyAll.match(HEDGES) || []).length;
  const hedgeDensity = words ? (hedgeHits / words) * 100 : 0;

  const contradictions = [];
  for (const [key, entry] of cluster.claimIndex) {
    if (entry.values.size > 1 && (STATE_KEYS.has(key) || key === 'toll')) {
      const byVal = {};
      for (const t of entry.texts) (byVal[t.value] ||= []).push(t.source);
      contradictions.push({ key, byVal });
    }
  }

  const socialOnly = co.count === 0 && co.social.length > 0;
  const rivalsOnly = co.count === 0 && co.rivals.length > 0;
  const youngAccounts = cluster.items.filter(i => i.authorMeta && i.authorMeta.accountAgeDays < 30);
  const recycled = cluster.items.filter(i => i.flags.includes('recycled-media'));
  const denial = cluster.claimIndex.has('denial');
  const provenanceDoubt = cluster.claimIndex.has('provenance_doubt');

  const mag = magnitude(cluster).value;
  if (mag > 0.5 && co.count < 2) risks.push({ level:'high', code:'single-source', text:`High-impact claim resting on ${co.count} independent organisation${co.count===1?'':'s'}.` });
  if (socialOnly) risks.push({ level:'high', code:'social-only', text: rivalsOnly
    ? `No wire, no official and nobody of ours. Only open social and a ${co.rivals.map(r=>SOURCES[r].label).join('/')} pickup.`
    : 'Nothing but open social so far. No wire, no official, nobody of ours.' });
  for (const a of youngAccounts) risks.push({ level:'high', code:'young-account', text:`${a.id} posted from an account ${a.authorMeta.accountAgeDays} days old with ${a.authorMeta.priorPosts} prior posts and ${a.authorMeta.followers.toLocaleString('en-IN')} followers.` });
  for (const r of recycled) risks.push({ level:'high', code:'recycled', text:`Attached media on ${r.id} matches footage already in circulation from an earlier event.` });
  if (provenanceDoubt) risks.push({ level:'high', code:'provenance', text:'The same clip is circulating with conflicting captions and dates.' });
  if (denial) risks.push({ level:'high', code:'denial', text:'The named authority has denied the central claim on record.' });
  for (const c of contradictions) {
    const desc = Object.entries(c.byVal).map(([v,s]) => `${v} (${s.map(x => SOURCES[x]?.label || x).join(', ')})`).join(' vs ');
    risks.push({ level:'medium', code:'contradiction', text:`Sources disagree on ${c.key}: ${desc}.` });
  }
  if (hedgeDensity > 1.2) risks.push({ level:'low', code:'hedging', text:`Hedging language is dense across the tape (${hedgeDensity.toFixed(1)} per 100 words), so most of this is still attributed rather than confirmed.` });
  const hardNews = ['metro','politics','business','world'].includes(cluster.beat);
  const isLocationEvent = cluster.claimIndex.has('location') || cluster.claimIndex.has('event');
  if (!co.official && hardNews) risks.push({ level:'medium', code:'no-official', text:'No on-record statement from the named authority yet.' });
  if (!co.ownStaff && hardNews && isLocationEvent) risks.push({ level:'low', code:'no-own', text:'Nobody of ours has been at the location.' });
  if (cluster.items.some(i => i.flags.includes('embargo'))) risks.push({ level:'low', code:'embargo', text:'Cluster contains embargoed copy. Check the clock before anything goes out.' });

  const highs = risks.filter(r => r.level === 'high').length;
  const meds  = risks.filter(r => r.level === 'medium').length;

  /* Corroboration absorbs item-level noise. Once five
     organisations and the police are on a story, one throwaway
     account attaching old footage is a bad arrival to exclude,
     not a reason to distrust the cluster. */
  const strength = Math.min(1, co.count / 3) * (co.official ? 1 : 0.6);
  let confidence = 100 * (0.40 * authority + 0.40 * Math.min(1, co.count / 3) + 0.20 * (co.official ? 1 : 0.2));
  confidence -= highs * 22 * (1 - strength) + meds * 7;
  if (denial) confidence = Math.min(confidence, 12);
  confidence = Math.max(3, Math.min(97, Math.round(confidence)));

  const band = confidence >= 70 ? 'Confirmed' : confidence >= 40 ? 'Partly confirmed' : 'Unverified';

  /* The single call that would settle it. Named, or nothing.
     A generic suggestion is noise an editor learns to skip. */
  let oneCall = null;
  const ents = new Set();
  cluster.items.forEach(i => i.entitySet.forEach(e => ents.add(e)));
  for (const e of ents) if (WHO_TO_ASK[e]) { oneCall = WHO_TO_ASK[e]; break; }
  if (co.official && oneCall) oneCall = null;
  if (!oneCall && !co.ownStaff && hardNews && isLocationEvent && confidence < 80)
    oneCall = 'our nearest stringer, for an independent look at the site';

  const excludeItems = cluster.items.filter(i =>
    i.flags.includes('recycled-media') ||
    (i.authorMeta && i.authorMeta.accountAgeDays < 30) ||
    (i.src.tier >= 4 && i.verdict && i.verdict.type === 'UNVERIFIED')
  ).map(i => i.id);

  const CHECKABLE = new Set(['recycled','young-account','provenance','denial']);
  const hardSignals = risks.filter(r => CHECKABLE.has(r.code));

  return { confidence, band, risks, contradictions, oneCall,
           corroboration: co, hedgeDensity, excludeItems, hardSignals };
}

const USABLE = new Set(['wire','reporter','stringer','official','itg']);

/* ---------------------------------------------------------
   9 · Destination
   ITG is not one outlet. Getting the brand and the language
   right matters more than the digital-or-TV binary.
--------------------------------------------------------- */
const BRANDS = {
  aajtak:      { name:'Aaj Tak',          medium:'TV + digital', lang:'Hindi' },
  itTv:        { name:'India Today TV',   medium:'TV',           lang:'English' },
  itDigital:   { name:'India Today',      medium:'Digital',      lang:'English' },
  businessToday:{name:'Business Today',   medium:'Digital + TV', lang:'English' },
  lallantop:   { name:'Lallantop',        medium:'Digital video',lang:'Hindi' }
};

function routing(cluster, imp, urg) {
  if (cluster.routingOverride) return { ...cluster.routingOverride, overridden:true };

  const airable = cluster.items.filter(i => USABLE.has(i.src.kind));
  const video = airable.reduce((s,i) => s + (i.assets.video||0), 0);
  const photo = airable.reduce((s,i) => s + (i.assets.photo||0), 0);
  const live  = cluster.items.some(i => i.assets.live);
  const langs = new Set(cluster.items.map(i => i.lang));
  const hasHindi = langs.has('hi');
  const hasTamil = langs.has('ta');

  const movingFigures = cluster.claimIndex.has('toll') || cluster.claimIndex.has('trapped') || cluster.claimIndex.has('rescued');
  const casualtyEvent = movingFigures && ['metro','world'].includes(cluster.beat);

  const tvParts = [
    { name:'moving pictures exist', w:0.35, v: Math.min(1, video/2), say: video ? `${video} video ${video===1?'file':'files'} on the tape` : 'no video yet' },
    { name:'live shape',            w:0.25, v: live ? 1 : (movingFigures ? 0.8 : (urg.value/100)*0.6), say: live ? 'live event' : movingFigures ? 'figures still moving, rolling coverage shape' : 'not a rolling story' },
    { name:'urgency',               w:0.25, v: urg.value/100, say:`urgency ${urg.value}` },
    { name:'visual event',          w:0.15, v: casualtyEvent ? 1 : (['metro','world','sport'].includes(cluster.beat) ? 0.9 : 0.35), say: casualtyEvent ? `casualty event on the ${cluster.beat} desk` : `${cluster.beat} story` }
  ];
  const digParts = [
    { name:'search and social pull',w:0.28, v: Math.min(1, cluster.items.reduce((s,i)=>s+i.socialVolume,0)/8000), say:'audience pull on this topic' },
    { name:'claim depth',           w:0.24, v: Math.min(1, cluster.claimIndex.size/7), say:`${cluster.claimIndex.size} claims to lay out` },
    { name:'importance',            w:0.28, v: imp.value/100, say:`importance ${imp.value}` },
    { name:'explainer shape',       w:0.20, v: ['business','education','politics'].includes(cluster.beat) ? 0.9 : 0.5, say: ['business','education','politics'].includes(cluster.beat) ? 'benefits from an explainer' : 'straight news shape' }
  ];
  const tv  = tvParts.reduce((s,p)=>s+p.w*p.v,0);
  const dig = digParts.reduce((s,p)=>s+p.w*p.v,0);

  let primary, secondary, note = null;
  if (cluster.beat === 'business') {
    primary = BRANDS.businessToday;
    secondary = live ? BRANDS.itTv : BRANDS.itDigital;
  } else if (hasHindi && tv > 0.5) {
    primary = BRANDS.aajtak;
    secondary = BRANDS.itDigital;
  } else if (tv > dig) {
    primary = BRANDS.itTv;
    secondary = hasHindi ? BRANDS.aajtak : BRANDS.itDigital;
  } else {
    primary = BRANDS.itDigital;
    secondary = hasHindi ? BRANDS.aajtak : BRANDS.itTv;
  }
  if (cluster.beat === 'politics' && dig > 0.55 && video) secondary = BRANDS.lallantop;
  if (hasTamil) note = 'Tamil-origin story with no Tamil property in the group. English digital plus an Aaj Tak package with subtitles is the closest fit.';
  if (photo === 0 && video === 0) note = (note ? note + ' ' : '') + 'No pictures on the tape. TV cannot lead with this until a crew or a stringer feed lands.';

  const decision = tv > dig ? 'TV first, digital alongside'
                 : (tv > 0.45 ? 'Digital first, TV package to follow' : 'Digital only');

  return { decision, primary, secondary, tv:Math.round(tv*100), dig:Math.round(dig*100), tvParts, digParts, note, overridden:false };
}

function recordOverride(graph, cluster, chosen, reason) {
  cluster.routingOverride = chosen;
  graph.overrides.push({ cluster: cluster.id, beat: cluster.beat, chosen: chosen.decision, reason, at: Date.now() });
  const same = graph.overrides.filter(o => o.beat === cluster.beat).length;
  if (same >= 2) graph.beatBias[cluster.beat] = Math.min(0.08, (graph.beatBias[cluster.beat] || 0) + 0.02);
}

/* ---------------------------------------------------------
   10 · Claim ledger and the coverage gap
   Story count is a vanity metric. The question a desk can act
   on is which facts a rival is carrying that we are not.
--------------------------------------------------------- */
function ledger(cluster) {
  const cols = [];
  const push = k => { if (!cols.includes(k)) cols.push(k); };
  for (const it of cluster.items) push(it.source);
  const rows = [];
  for (const [key, entry] of cluster.claimIndex) {
    const row = { key, values:[...entry.values], by:{} };
    for (const t of entry.texts) row.by[t.source] = t.value;
    rows.push(row);
  }
  const oursHave = new Set();
  cluster.items.filter(i => ['itg','reporter','stringer'].includes(i.src.kind))
    .forEach(i => i.claims.forEach(c => oursHave.add(c.key)));
  const wireHave = new Set();
  cluster.items.filter(i => i.src.kind === 'wire' || i.src.kind === 'official')
    .forEach(i => i.claims.forEach(c => wireHave.add(c.key)));

  const gaps = [];
  for (const row of rows) {
    const rivals = Object.keys(row.by).filter(s => SOURCES[s]?.kind === 'competitor');
    const weHaveIt = oursHave.has(row.key) || wireHave.has(row.key);
    if (rivals.length && !weHaveIt) {
      gaps.push({ key: row.key, value: row.by[rivals[0]], who: rivals.map(r => SOURCES[r].label) });
    }
  }
  return { cols, rows, gaps, oursHave:[...oursHave], wireHave:[...wireHave] };
}

/* ---------------------------------------------------------
   11 · Grounded draft
   Every sentence carries the id of the item it came from. A
   sentence with no source does not get written. Rival copy is
   never drafted from, only listed as something to confirm.
--------------------------------------------------------- */
function draft(cluster, lang) {
  lang = lang || 'en';
  const langKey = 'text_' + lang;
  let missing = 0, total = 0;
  const localize = t => {                       // model phrases the same sourced fact in the chosen language
    total++;
    if (lang === 'en') return t.text;
    if (t[langKey]) return t[langKey];
    missing++; return t.text;                   // fall back to source language, counted as "not yet phrased"
  };
  const usable = cluster.items.filter(i => USABLE.has(i.src.kind));
  const rank = i => i.src.trust + (i.src.kind === 'reporter' ? 0.1 : 0) + (i.flags.includes('correction') ? 0.2 : 0);
  const order = ['toll','event','location','injured','rescued','trapped','cause','decision','crr','impact',
                 'response','official_quote','official_presence','denial','arrests','probe','compensation',
                 'accountability','notice_history','licensing','human_detail','structure_use','casualties','reaction','growth'];

  const picked = new Map();
  for (const key of order) {
    const entry = cluster.claimIndex.get(key);
    if (!entry) continue;
    const candidates = entry.texts.filter(t => USABLE.has(SOURCES[t.source]?.kind));
    if (!candidates.length) continue;
    candidates.sort((a,b) => {
      const ia = cluster.items.find(x => x.id === a.itemId), ib = cluster.items.find(x => x.id === b.itemId);
      return rank(ib) - rank(ia);
    });
    picked.set(key, candidates[0]);
  }

  /* "Three feared trapped" is not wrong, it is over. Once a
     toll lands, the earlier figure is history, not a sentence. */
  const SUPERSEDES = { toll:['trapped'], denial:['event','toll','provenance_doubt'], decision:['expectation'] };
  for (const [winner, losers] of Object.entries(SUPERSEDES))
    if (picked.has(winner)) losers.forEach(l => picked.delete(l));

  const sentences = [];
  for (const [key, t] of picked) {
    const item = cluster.items.find(x => x.id === t.itemId);
    sentences.push({
      text: localize(t),
      textEn: t.text,
      claimKey: key,
      itemId: t.itemId,
      source: t.source,
      sourceLabel: item.src.label,
      rights: item.src.rights,
      snippet: item.body
    });
  }

  /* Attribution line, because a draft that does not say where
     it came from is not publishable copy. */
  const orgs = [...new Set(usable.filter(i => i.src.kind === 'wire').map(i => i.src.label))];
  if (orgs.length) {
    total++;
    const attrText = lang === 'hi' ? `विवरण ${orgs.join(' और ')} ने रिपोर्ट किया।`
                                    : `Details were reported by ${orgs.join(' and ')}.`;
    if (lang !== 'en' && lang !== 'hi') missing++;
    sentences.push({ text:attrText, textEn:`Details were reported by ${orgs.join(' and ')}.`, claimKey:'attribution',
      itemId: usable.find(i => i.src.kind === 'wire').id, source:'—', sourceLabel:'attribution', rights:'own',
      snippet:'Generated attribution line, required by the wire terms attached to this cluster.' });
  }

  /* Our own back catalogue, as a context sentence plus a real
     internal link. This is what the graph buys us for free. */
  const arch = (cluster.related || []).map(r => r.item).filter(i => i.url).slice(0, 2);
  for (const a of arch) {
    const c = a.claims[0];
    sentences.push({ text: localize(c), textEn:c.text, claimKey:'context', itemId:a.id, source:a.source,
      sourceLabel:`${a.brand} archive`, rights:'own', snippet:a.body, internal:a.url, internalTitle:a.headline });
  }

  const cred = credibility(cluster);
  const holdBack = [];
  if (cred.contradictions.length)
    holdBack.push(`Figures are still in dispute on ${cred.contradictions.map(c=>c.key).join(', ')}. Carry the wire figure only.`);
  const lg = ledger(cluster);
  for (const g of lg.gaps)
    holdBack.push(`${g.who.join('/')} are carrying ${g.key} as "${g.value}". Not in the draft. Confirm independently before adding.`);

  /* Editorial gates. These are blocks, not advisories. */
  const gates = [];
  if (cred.confidence < 40) gates.push('Confidence is below the publish floor. Desk head sign-off required.');
  if (cluster.claimIndex.has('denial')) gates.push('The named authority has denied the central claim. This cannot run as fact.');
  if (cluster.claimIndex.has('accountability') || cluster.claimIndex.has('arrests'))
    gates.push('Names an accused or an absconding party. Legal read required before publish.');
  if (cluster.items.some(i => i.flags.includes('embargo')))
    gates.push('Embargoed material in cluster. Publish is locked until the embargo lifts.');
  const noVerbatim = cluster.items.filter(i => i.src.rights === 'no-verbatim').map(i => i.src.label);
  if (noVerbatim.length) gates.push(`${[...new Set(noVerbatim)].join(', ')} copy cannot be used verbatim. Every sentence sourced there has been rewritten.`);

  const seo = seoFor(cluster, sentences);
  const checklist = checklistFor(cluster, cred);

  return { sentences, holdBack, gates, seo, checklist, confidence: cred.confidence, band: cred.band,
           lang, langComplete: lang === 'en' || missing === 0 };
}

function titleCaseKeep(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

function seoFor(cluster, sentences) {
  /* Tags come from copy we can stand behind, not from every
     passer-by who tweeted near the story. */
  const ents = [];
  for (const it of cluster.items) {
    if (!USABLE.has(it.src.kind)) continue;
    for (const e of (it.entities || [])) if (!ents.includes(e)) ents.push(e);
  }
  const place = ents.find(e => /satya niketan|dwarka|bengaluru|itarsi|madurai/i.test(e))
             || ents.find(e => /delhi|mumbai|madhya|malaysia|chennai/i.test(e)) || ents[0] || '';
  const tollBest = bestValue(cluster, 'toll');
  const toll = tollBest && !tollBest.unusable ? String(tollBest.value).replace(/[^0-9]/g,'') : null;

  const evtBest = bestValue(cluster, 'event');
  const key = evtBest && !evtBest.unusable ? evtBest.value : cluster.beat;
  const seoHeadline = titleCaseKeep(`${place} ${key}${toll ? `: ${toll} dead` : ''}`.replace(/\s+/g,' ').trim()).slice(0, 65);
  const display = cluster.title.length > 90 ? cluster.title.slice(0, 87) + '…' : cluster.title;
  const social = toll
    ? `${toll} dead in ${place} ${key}. What we know so far.`
    : `${titleCaseKeep(key)} in ${place}. Here is what we know.`;
  const slug = seoHeadline.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,70);
  const metaDesc = sentences.slice(0,2).map(s => s.text).join(' ').slice(0, 155);
  const photoItem = cluster.items.find(i => (i.assets.photo || 0) > 0 && USABLE.has(i.src.kind));
  const altText = photoItem ? `${place}: ${key} site, photographed by ${photoItem.src.label}` : null;
  const internal = (cluster.related || []).map(r => r.item).filter(i => i.url)
    .slice(0, 3).map(i => ({ title:i.headline, url:i.url }));

  const jsonld = {
    '@context':'https://schema.org', '@type':'NewsArticle',
    headline: seoHeadline,
    datePublished: new Date().toISOString(),
    articleSection: cluster.beat,
    about: ents.slice(0,6).map(e => ({ '@type':'Thing', name:e })),
    publisher: { '@type':'Organization', name:'India Today Group' }
  };

  const video = cluster.items.filter(i => USABLE.has(i.src.kind)).reduce((s,i)=>s+(i.assets.video||0),0);
  const placeUp = place ? place.toUpperCase() : '';
  const tvHeadline = (toll ? `${placeUp}: ${toll} DEAD`
      : `${placeUp}${placeUp?': ':''}${titleCaseKeep(key).toUpperCase()}`).replace(/\s+/g,' ').trim().slice(0,44);
  const ticker = (toll ? `${toll} DEAD IN ${placeUp} ${String(key).toUpperCase()}`
      : `${placeUp} ${String(key).toUpperCase()}`).replace(/\s+/g,' ').trim().slice(0,96);
  const tv = { headline: tvHeadline, ticker, video };

  return { display, seoHeadline, social, slug, metaDesc, tags:ents.slice(0,8), altText, internal, jsonld, tv };
}

function checklistFor(cluster, cred) {
  const photo = cluster.items.filter(i => USABLE.has(i.src.kind)).reduce((s,i)=>s+(i.assets.photo||0),0);
  const video = cluster.items.filter(i => USABLE.has(i.src.kind)).reduce((s,i)=>s+(i.assets.video||0),0);
  const out = [];
  out.push({ ok: photo > 0, text: photo > 0 ? `${photo} usable stills on the tape` : 'No usable still. Picture desk needed.' });
  out.push({ ok: video > 0, text: video > 0 ? `${video} usable video ${video===1?'file':'files'}` : 'No usable video. TV cannot lead.' });
  out.push({ ok: cred.corroboration.official, text: cred.corroboration.official ? 'On-record statement from the authority is in' : 'No on-record statement yet' });
  out.push({ ok: cred.corroboration.ownStaff, text: cred.corroboration.ownStaff ? 'Our own reporter or stringer has filed' : 'Nobody of ours has filed' });
  out.push({ ok: cred.corroboration.count >= 2, text: cred.corroboration.count >= 2 ? `${cred.corroboration.count} independent organisations` : 'Second independent source needed' });
  const quote = cluster.claimIndex.has('official_quote') || cluster.items.some(i => i.src.kind === 'official');
  out.push({ ok: quote, text: quote ? 'Quotable line available' : 'No quote we can use' });
  return out;
}

/* ---------------------------------------------------------
   12 · Desk assignment
--------------------------------------------------------- */
function suggestReporter(cluster, desk) {
  const scored = desk.map(d => {
    let s = 0;
    if (d.beat === cluster.beat) s += 0.6;
    const ents = new Set();
    cluster.items.forEach(i => i.entitySet.forEach(e => ents.add(e)));
    if ([...ents].some(e => e.includes(d.location.toLowerCase()))) s += 0.3;
    s -= d.load * 0.06;
    return { ...d, fit: s };
  }).sort((a,b) => b.fit - a.fit);
  return scored;
}

/* ---------------------------------------------------------
   13 · Board state
--------------------------------------------------------- */
function board(graph, now) {
  return graph.clusters.map(c => {
    const imp = importance(c, graph);
    const urg = urgency(c, now, graph);
    const cred = credibility(c);
    const rt = routing(c, imp, urg);
    const dups = c.items.filter(i => i.verdict && i.verdict.type === 'DUPLICATE').length;
    /* Anything this thin does not belong on a planning board
       at all, however important it would be if it were true. */
    const quadrant = cred.confidence < 30 ? 'hold'
      : imp.value >= 50
        ? (urg.value >= 50 ? 'move-now' : 'plan-it')
        : (urg.value >= 50 ? 'watch' : 'park');
    return { cluster:c, imp, urg, cred, routing:rt, dups, quadrant,
             why: why(imp, urg), ledger: ledger(c) };
  }).sort((a,b) => (b.urg.value + b.imp.value) - (a.urg.value + a.imp.value));
}

const QUADRANTS = {
  'move-now': { label:'Move now',        blurb:'Matters and decays fast.' },
  'plan-it':  { label:'Plan it',         blurb:'Matters, keeps. Give it a proper piece.' },
  'watch':    { label:'Watch',           blurb:'Loud but thin. Verify before touching.' },
  'park':     { label:'Park',            blurb:'Neither. Queue or drop.' },
  'hold':     { label:'Hold and check',  blurb:'Too thin to act on. Verify or kill.' }
};

/* ==== api ==== */
/* ============================================================
   News Hunt — Input Desk
   api.js  ·  the mock backend
   ------------------------------------------------------------
   Every method here is async and maps one-to-one onto a real
   endpoint. Swapping the mock for production is a matter of
   changing what is behind these five calls; nothing upstream
   in the engine or the UI needs to know.

     fetchSources()   -> config table: source tiers and rights
     fetchArchive()   -> ITG CMS search over the back catalogue
     fetchTape()      -> the ingest firehose. In production this
                         is a websocket or a long-poll off PTI,
                         ANI, Reuters, the social listeners and
                         the rival scrapers. Here it is the fixed
                         replay tape.
     generateDraft(c) -> the ONE model call. Per cluster, at
                         draft time, over a fixed claim set. Not
                         per arrival. This is the cost boundary.
     saveDraft(p)     -> CMS write. Always status:draft. There is
                         deliberately no publish endpoint here.
   ============================================================ */


const latency = ms => new Promise(r => setTimeout(r, ms));
const clone = x => (typeof structuredClone === 'function')
  ? structuredClone(x) : JSON.parse(JSON.stringify(x));

/* Which live feeds are "connected". Drives the ribbon so the
   multi-source-ingest requirement is visible, not just claimed. */
const FEED_REGISTRY = [
  { id:'PTI',     label:'PTI',        status:'live' },
  { id:'ANI',     label:'ANI',        status:'live' },
  { id:'REUTERS', label:'Reuters',    status:'live' },
  { id:'AFP',     label:'AFP',        status:'live' },
  { id:'ITG',     label:'ITG filing', status:'live' },
  { id:'OFFICIAL',label:'Official handles', status:'live' },
  { id:'SOCIAL',  label:'Social listeners', status:'live' },
  { id:'RIVALS',  label:'Rival wires', status:'live' },
  { id:'GTRENDS', label:'Google Trends (IN)', status:'live' }
];

const NewsHuntAPI = {
  async fetchFeeds() {
    await latency(60);
    return FEED_REGISTRY;
  },

  async fetchSources() {
    await latency(40);
    return SOURCES;
  },

  async fetchArchive() {
    await latency(180);   // a CMS search is not instant
    return clone(RAW_ARCHIVE);
  },

  async fetchTape() {
    await latency(220);   // first firehose connection
    return clone(RAW_ITEMS).sort((a, b) => a.t - b.t);
  },

  async fetchDesk() {
    await latency(40);
    return clone(RAW_DESK);
  },

  /* The model call. Kept behind a promise on purpose: it is the
     only place latency and cost live, and the UI shows a real
     grounding state while it runs. The grounding itself is
     deterministic (engine.draft); a production version would
     hand the fixed claim set to a model to phrase, never to
     invent, which is what keeps every sentence traceable. */
  async generateDraft(cluster, lang) {
    await latency(650);
    return draft(cluster, lang);
  },

  /* Live demand-side signal. In production this polls Google
     Trends' RSS (trends.google.com/trending/rss?geo=IN). Trends
     lag real events, so they never originate a story here — they
     only confirm public attention on one the supply side already
     surfaced. The fetch is attempted; offline it falls back to a
     representative snapshot so the demo still runs. */
  async fetchTrends() {
    const FALLBACK = [
      { title:'Satya Niketan', traffic:'200K+', rank:1 },
      { title:'Delhi building collapse', traffic:'100K+', rank:2 },
      { title:'RBI policy', traffic:'50K+', rank:3 },
      { title:'India vs South Africa', traffic:'50K+', rank:4 },
      { title:'Vijay Madurai rally', traffic:'20K+', rank:5 },
      { title:'DU South Campus', traffic:'20K+', rank:6 }
    ];
    try {
      const res = await fetch('https://trends.google.com/trending/rss?geo=IN', { mode:'cors' });
      if (!res.ok) throw new Error('status ' + res.status);
      const xml = new DOMParser().parseFromString(await res.text(), 'text/xml');
      const items = [...xml.querySelectorAll('item')].slice(0, 8).map((n, i) => ({
        title: n.querySelector('title')?.textContent?.trim() || '',
        traffic: n.getElementsByTagName('ht:approx_traffic')[0]?.textContent?.trim() || '',
        rank: i + 1
      })).filter(t => t.title);
      return items.length ? { live:true, items } : { live:false, items:FALLBACK };
    } catch (e) {
      return { live:false, items:FALLBACK, error:String(e && e.message || e) };
    }
  },

  async saveDraft(payload) {
    await latency(400);
    return { ok: true, id: 'DRAFT-' + Math.floor(Math.random() * 9000 + 1000),
             status: 'draft', receivedAt: new Date().toISOString() };
  },

  async sendToTv(payload) {
    await latency(400);
    return { ok: true, id: 'TV-' + Math.floor(Math.random() * 9000 + 1000),
             status: 'queued', receivedAt: new Date().toISOString() };
  }
};

/* ---------- replay engine ---------- */
function rebuild(target){
  S.graph = newGraph(); loadArchive(S.graph, ARCHIVE);
  S.cursor=0; S.now=0; S.alerts=[]; S.seenAlert=new Set();
  advanceTo(target);
}
function advanceTo(target){
  while(S.cursor<TAPE.length && TAPE[S.cursor].t<=target){
    const raw=TAPE[S.cursor++]; S.now=raw.t;
    const res=ingest(S.graph, raw, raw.t); evalAlerts(res);
  }
  S.now=target;
}
function evalAlerts(res){
  const rows=board(S.graph,S.now);
  for(const r of rows){
    const wireBacked=r.cluster.items.some(i=>i.src.tier===1 && ['wire','official','reporter'].includes(i.src.kind));
    const worth=r.imp.value>=50 && (r.urg.intrinsic>=45 || (wireBacked && r.imp.value>=58));
    const key=r.cluster.id+':move';
    if(worth && r.cred.confidence>=30 && !S.seenAlert.has(key)){
      S.seenAlert.add(key);
      S.alerts.unshift({ clusterId:r.cluster.id, at:S.now });
    }
  }
}

}

function stats(){
  const g=S.graph, rows=board(g,S.now);
  const arrivals=g.arrivals.length;
  const merged=g.arrivals.filter(a=>a.verdict.type==='DUPLICATE').length;
  const stories=g.clusters.length;
  const moveNow=rows.filter(r=>r.quadrant==='move-now');
  const planIt=rows.filter(r=>r.quadrant==='plan-it');
  const check=rows.filter(r=>r.quadrant==='watch'||r.quadrant==='hold');
  const parked=rows.filter(r=>r.quadrant==='park');
  const verified=rows.filter(r=>r.cred.band==='Confirmed').length;
  const flagged=rows.filter(r=>r.cred.hardSignals.length).length;
  const gaps=rows.reduce((s,r)=>s+r.ledger.gaps.length,0);
  const corrections=g.arrivals.filter(a=>a.verdict.type==='CORRECTION');
  let leading=0,trailing=0;
  for(const r of rows){ if(!r.cluster.items.some(i=>i.src.kind==='competitor')) continue;
    if(r.ledger.gaps.length) trailing++; else leading++; }
  const srcCount=new Set(g.arrivals.map(a=>a.item.source)).size;
  const skippable=merged + parked.reduce((s,r)=>s+r.cluster.items.length,0);
  const pctSkippable=arrivals?Math.round((skippable/arrivals)*100):0;
  const leads=rows.map(r=>{ const fa=[...S.alerts].reverse().find(a=>a.clusterId===r.cluster.id);
    const rv=r.cluster.items.filter(i=>i.src.kind==='competitor').sort((a,b)=>a.arrivedAt-b.arrivedAt)[0];
    return (fa&&rv)?rv.arrivedAt-fa.at:null; }).filter(x=>x!=null&&x>0);
  const avgLead=leads.length?leads.reduce((s,x)=>s+x,0)/leads.length:0;
  return { rows, arrivals, merged, stories, moveNow, planIt, check, parked,
    verified, flagged, gaps, corrections, leading, trailing, srcCount,
    pctSkippable, avgLead };
}
