  }
  if(id==='decide'){
    body=`<p>The group is not one outlet. ${BRAND} suggests where each story should go — which brand (Aaj Tak, India Today, Aaj Tak Bangla, Business Today…), which language, and whether it belongs on TV, on digital, or both. The desk can accept the suggestion or change it in one tap.</p>
      <div class="tally">
        <div class="ty"><b>${d.stories}</b><span>stories routed</span></div>
        <div class="ty amber"><b>${d.trailing}</b><span>where a rival is ahead</span></div>
        <div class="ty"><b>${d.moveNow.length}</b><span>flagged for a human call</span></div>
      </div>`;
  }
  if(id==='publish'){
    body=`<p>One click writes the story. Every sentence is tied to the exact arrival it came from — a sentence with no source is never written, and rival copy is never drafted from. It comes with the search and social headlines, the tags, the internal links, and hard blocks a person must clear. It saves as a draft. There is no publish button.</p>
      <div class="tally">
        <div class="ty"><b>${d.stories}</b><span>stories ready to draft</span></div>
        <div class="ty green"><b>100%</b><span>sentences carry a source</span></div>
        <div class="ty red"><b>0</b><span>auto-published, ever</span></div>
      </div>`;
  }
  return `<section class="panel"><div class="panelhead"><h3>${st.name}</h3>
    <button class="x" data-act="closestage" aria-label="Close">Close</button></div>${body}</section>`;
}

/* ---------- google trends: demand-side signal ---------- */
function trendMatch(title){
  if(!S.graph) return null;
  const q=String(title||'').toLowerCase();
  const first=q.split(' ')[0];
  for(const c of S.graph.clusters){
    const ents=new Set(); c.items.forEach(i=>i.entitySet.forEach(e=>ents.add(e)));
    for(const e of ents){ if(e && (q.includes(e) || (first.length>3 && e.includes(first)))) return c; }
    if(c.title && first.length>3 && c.title.toLowerCase().includes(first)) return c;
  }
  return null;
}
function trendsPanel(){
  const tr=S.trends; if(!tr) return '';
  const src=tr.live?'live from Google Trends India':'Google Trends India · offline snapshot';
  const chips=tr.items.map(t=>{
    const c=trendMatch(t.title);
    return `<span class="trendchip ${c?'hot':''}" ${c?`data-open="${c.id}" role="button" tabindex="0"`:''}>${esc(t.title)}<span class="tr">${c?'a live story':esc(t.traffic||'')}</span></span>`;
  }).join('');
  return `<div class="trends"><h4><span class="gdot"></span>Google Trends — what India is searching right now</h4>
    <p class="tsub">A demand-side signal, wired in from <span class="mono">trends.google.com/trending/rss?geo=IN</span>. Trends lag the newsroom feeds, so they never break a story here — they confirm which of our stories the public is already searching. Highlighted chips match a live story. <b>${esc(src)}.</b></p>
    <div class="trendchips">${chips}</div></div>`;
}
function storyTrend(c){
  const tr=S.trends; if(!tr) return '';
  const t=tr.items.find(x=>{ const m=trendMatch(x.title); return m && m.id===c.id; });
  if(!t) return '';
  return `<div class="storytrend"><span class="gdot"></span><span>Public attention: <b>&ldquo;${esc(t.title)}&rdquo;</b> is trending #${t.rank} on Google Trends India${t.traffic?` (${esc(t.traffic)} searches)`:''}. The search spike confirms this story is landing — but it reached our feeds before it trended, which is the whole point of watching the supply side.</span></div>`;
}

/* ---------- the output: what the desk should do ---------- */
function output(d){
  const groups=[
    { key:'move', title:'Act now', sub:'Matters, and moving fast — needs a decision in minutes.', rows:d.moveNow, tone:'red' },
    { key:'plan', title:'On the radar', sub:'Matters, but it keeps. Give it a proper piece, no rush.', rows:d.planIt, tone:'amber' },
    { key:'check', title:'Check before touching', sub:'Loud, but thin. Not trusted yet — verify before anything runs.', rows:d.check, tone:'violet' }
  ];
  return `<section class="out">
    <div class="outhead"><h2>What the desk should do right now</h2>
      <p>The pipeline's output, ranked. Every card says why it sits where it sits.</p></div>
    <div class="legend">
      <span><i style="background:var(--red)"></i> Act now</span>
      <span><i style="background:var(--amber)"></i> On the radar</span>
      <span><i style="background:var(--violet)"></i> Check first</span>
      <span><i style="background:var(--green)"></i> Trust score: green = confirmed, violet = unverified</span>
    </div>
    ${d.corrections.length?correctionStrip(d.corrections):''}
    ${groups.filter(g=>g.rows.length).map(g=>`
      <div class="group g-${g.tone}">
        <div class="grouphead"><span class="gflag">${g.title}</span><span class="gsub">${esc(g.sub)}</span></div>
        <div class="cards">${g.rows.map(storyCard).join('')}</div>
      </div>`).join('')}
    ${d.parked.length?`<p class="parked">${d.parked.reduce((s,r)=>s+r.cluster.items.length,0)} more arrivals parked as low priority or duplicates — off the desk's plate entirely.</p>`:''}
  </section>`;
}

function correctionStrip(cors){
  return `<div class="corstrip">
    <span class="cflag">Correction</span>
    <span class="ctext">A wire has changed a published figure. Anything already live carrying the old number needs fixing now.</span>
    ${cors.map(c=>`<button class="clink" data-open="${c.cluster.id}">${esc(c.cluster.title.slice(0,42))}</button>`).join('')}
  </div>`;
}

function shieldIcon(){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg>`;
}
function humanGap(gaps){
  const labels=gaps.slice(0,3).map(g=>keyLabel(g.key));
  if(labels.length<=1) return labels.join('');
  return labels.slice(0,-1).join(', ')+' and '+labels[labels.length-1];
}
function storyCard(r){
  const c=r.cluster;
  const rival=c.items.filter(i=>i.src.kind==='competitor').sort((a,b)=>a.arrivedAt-b.arrivedAt)[0];
  const corrected=c.items.some(i=>i.verdict&&i.verdict.type==='CORRECTION');
  const updated=Math.max(...c.items.map(i=>i.arrivedAt));
  const route=[r.routing.primary.name, r.routing.secondary&&r.routing.secondary.name].filter(Boolean);
  const rl=[...new Set(route)].join(' · ');
  return `<article class="card" data-open="${c.id}" tabindex="0" role="button">
    <div class="cardtop">
      <span class="beat">${BEATS[c.beat]||c.beat} desk</span>
      <span class="vchip ${bandClass(r.cred.band)}" title="How confident we are the story stands up, out of 100">${shieldIcon()}${r.cred.confidence}/100 · ${esc(r.cred.band)}</span>
      ${corrected?`<span class="cortag">figure corrected</span>`:''}
      <span class="cardtime" title="When the most recent item on this story arrived">updated ${ago(updated)}</span>
    </div>
    <h3>${esc(c.title)}</h3>
    <p class="why">${esc(r.why)}</p>
    ${rival&&r.ledger.gaps.length?`<p class="gap"><b>${esc(rival.src.label)} is ahead of us</b> — they've published ${esc(humanGap(r.ledger.gaps))}; we haven't confirmed that yet.</p>`:''}
    <div class="cardfoot">
      <span class="route"><span class="rlabel">Suggested for</span><span class="rval">${esc(rl)}</span></span>
      <span class="cta">See the journey ›</span>
    </div>
  </article>`;
}

/* ---------- impact ---------- */
function impact(d){
  const cards=[
    { b:d.merged, k:'duplicate items merged', p:'Repeats the desk never had to open or read.' },
    { b:d.avgLead?Math.round(d.avgLead/60)+' min':'—',
      k:d.avgLead?'earlier than rivals':'no rival beat us',
      p:d.avgLead?'Average head start before a competitor published — measured on our own signals, not a rival\u2019s byline.':'On this tape, no competitor published a story before we flagged it.' },
    { b:d.pctSkippable+'%', k:'cleared without a human', p:'Duplicates and low-priority arrivals, filtered out automatically.' },
    { b:d.stories, k:'stories to act on', p:`Distilled from ${d.arrivals} raw arrivals, each with the reason it matters attached.` }
  ];
  return `<section class="impact"><div class="impwrap">
    <div class="outhead"><h2>Why this matters for the desk</h2>
      <p>Same flood of content, a fraction of the manual effort — and the desk hears about a story sooner. Every number here is computed live from the tape.</p></div>
    <div class="impgrid">${cards.map(c=>`<div class="imp"><b>${c.b}</b><i>${esc(c.k)}</i><p>${esc(c.p)}</p></div>`).join('')}</div>
  </div></section>`;
}

/* ============================================================
   STORY JOURNEY — one story through all five stages
   ============================================================ */
function curStory(){ return S.storyId ? S.graph.clusters.find(c=>c.id===S.storyId) : null; }

function storyView(){
  const c=curStory();
  if(!c){ S.view='overview'; return overview(); }
  const imp=importance(c,S.graph), urg=urgency(c,S.now,S.graph);
  const cred=credibility(c), rt=routing(c,imp,urg), lg=ledger(c);
  const R={ cluster:c, imp, urg, cred, routing:rt, ledger:lg };
  return `<main class="story">
    ${storyHeader(R)}
    <div class="journey">
      <nav class="rail" aria-label="Stages">
        ${STAGES.map((st,i)=>`<a class="railitem" href="#stg-${st.id}"><span class="rn">${i+1}</span><span>${st.name}</span></a>`).join('')}
      </nav>
      <div class="stages">
        ${sGather(R)}
        ${sUnderstand(R)}
        ${sJudge(R)}
        ${sDecide(R)}
        ${sPublish(R)}
      </div>
    </div>
  </main>`;
}

function storyHeader(R){
  const c=R.cluster;
  return `<section class="storyhead">
    <button class="back" data-view="overview">Back to overview</button>
    <div class="shrow">
      <div>
        <h1>${esc(c.title)}</h1>
        <p class="shmeta">${BEATS[c.beat]||c.beat} · first seen ${clock(c.firstSeen)} · ${c.items.length} arrivals in this story</p>
      </div>
      <div class="shgauges">
        ${dial('Matters',R.imp.value)}
        ${dial('Moving',R.urg.value)}
        ${dial('Confidence',R.cred.confidence, bandClass(R.cred.band))}
      </div>
    </div>
    <p class="shexp">Below: exactly how ${BRAND} handled this one story, from the first anonymous post to a publish-ready draft.</p>
  </section>`;
}

function dial(label,v,tone){
  const t=tone||(v>=70?'b-corroborated':v>=40?'b-partly':'b-unverified');
  const r=26, circ=2*Math.PI*r, off=circ*(1-v/100);
  return `<div class="dial ${t}">
    <svg viewBox="0 0 64 64"><circle class="dt" cx="32" cy="32" r="${r}"/>
      <circle class="df" cx="32" cy="32" r="${r}" stroke-dasharray="${circ}" stroke-dashoffset="${off}"/></svg>
    <b>${v}</b><span>${label}</span></div>`;
}

function stageWrap(id,n,title,sub,body){
  return `<section class="stg" id="stg-${id}">
    <div class="stghead"><span class="stgn">${n}</span><div><h2>${title}</h2><p>${esc(sub)}</p></div></div>
    ${body}</section>`;
}

function sGather(R){
  const items=[...R.cluster.items].sort((a,b)=>a.arrivedAt-b.arrivedAt);
  const srcs=new Set(items.map(i=>i.source)).size;
  const body=`<ol class="tape">${items.map(i=>{
    const v=VERDICT[i.verdict.type]||{t:i.verdict.type,c:'v-new'};
    const dup=i.verdict.type==='DUPLICATE';
    return `<li class="ti ${dup?'dup':''} t${i.src.tier}">
      <span class="tt">${clock(i.arrivedAt)}</span>
      <span class="tsrc s${i.src.tier}">${esc(i.src.label)}</span>
      <span class="tv ${v.c}">${v.t}</span>
      <span class="th">${esc(i.headline)}</span>
    </li>`;
  }).join('')}</ol>
  <p class="stgnote">${items.length} arrivals from ${srcs} different sources — wires, our own stringer, an official handle, open social, and rival copy. The greyed rows are duplicates the system folded away, so nobody re-reads them.</p>
  ${storyTrend(R.cluster)}`;
  return stageWrap('gather',1,'Gather','Everything that came in about this story, in the order it landed.',body);
}

function sUnderstand(R){
  const c=R.cluster;
  const counts={}; for(const i of c.items){ const t=i.verdict.type; counts[t]=(counts[t]||0)+1; }
  const arch=(c.related||[]).slice(0,3);
  const body=`<div class="ucards">
    ${Object.entries(counts).map(([t,n])=>{ const v=VERDICT[t]||{t,c:'v-new'};
      return `<div class="ucard"><b>${n}</b><span class="tv ${v.c}">${v.t}</span></div>`; }).join('')}
  </div>
  ${arch.length?`<div class="archbox"><h4>Checked against our own past coverage</h4>
    ${arch.map(a=>`<p class="arch"><a href="${esc(a.item.url||'#')}">${esc(a.item.headline)}</a>
      <span>${esc(a.item.brand||'')} · ${a.score>=0.42?'we have filed on this before':'related background'}</span></p>`).join('')}
    <p class="stgnote">This answers the brief's "do we already have this?" — and these become the internal links on the finished draft, for free.</p></div>`
   :`<p class="stgnote">Nothing closely related in our past coverage — this is genuinely new.</p>`}`;
  return stageWrap('understand',2,'Group','All these arrivals are one story. Each one is labelled — new, update, development, or duplicate.',body);
}

function sJudge(R){
  const cred=R.cred;
  const excl=cred.excludeItems||[];
  const impBand = R.imp.value>=60?'a big story':R.imp.value>=40?'a solid story':'a minor story';
  const urgBand = R.urg.value>=60?'move now':R.urg.value>=40?'soon, not frantic':'no rush';
  const body=`<div class="judgegrid">
    <div class="jax">
      <h4>How big a deal is it? <b class="jscore">${R.imp.value}/100</b></h4>
      <p class="scoreexp">A 0&ndash;100 blend of five things, each weighted. Add up every bar below (bar length &times; its weight) and you get the score &mdash; here, ${impBand}.</p>
      ${R.imp.parts.slice(0,3).map(p=>barRow(p)).join('')}
      ${hiddenFactors(R.imp.parts)}
      <div class="bandkey"><span>0&ndash;39 minor</span><span>40&ndash;59 solid</span><span>60&ndash;100 big</span></div>
    </div>
    <div class="jax">
      <h4>How fast is it developing? <b class="jscore">${R.urg.value}/100</b></h4>
      <p class="scoreexp">The same 0&ndash;100 idea, but about speed: is it still changing, is attention rising, is a rival already out, will it go stale? Here it says <b>${urgBand}</b>.</p>
      ${R.urg.parts.slice(0,3).map(p=>barRow(p)).join('')}
      ${hiddenFactors(R.urg.parts)}
      <div class="bandkey"><span>0&ndash;39 no rush</span><span>40&ndash;59 soon</span><span>60&ndash;100 now</span></div>
    </div>
  </div>
  <div class="credbox ${bandClass(cred.band)}">
    <div class="credtop"><div class="bigconf"><b>${cred.confidence}</b><span>out of 100</span></div>
      <div class="credhead"><h4>Can we trust it? — ${esc(cred.band)}</h4>
      <p>A 0&ndash;100 read on how well the story stands up: mostly independent corroboration and whether an authority is on record, minus anything that looks thin. <b>70+ Confirmed, 40&ndash;69 Partly confirmed, under 40 Unverified.</b> It never calls anything "fake" — it shows what's thin and the one call that would settle it.</p></div></div>
    ${cred.risks.length?`<div class="riskhead">What looks shaky</div><ul class="risks">${cred.risks.slice(0,4).map(r=>`<li class="r-${r.level}"><span>${r.level==='high'?'serious':r.level==='medium'?'worth a check':'minor'}</span>${esc(r.text)}</li>`).join('')}</ul>`:''}
    ${cred.oneCall?`<p class="onecall"><span class="ocl">One call would settle it</span>Get the <b>${esc(cred.oneCall)}</b> on the record — that single confirmation is what moves this into "Confirmed."</p>`:''}
    ${excl.length?`<p class="excl"><b>${excl.length} arrival${excl.length===1?'':'s'} held out of the copy</b> — recycled footage and throwaway accounts (like the viral "50 dead" post). The story still stands on the wires and the police; these arrivals never touch it. This is the "check before touching" catch, inside a story we do trust.</p>`:''}
  </div>`;
  return stageWrap('judge',3,'Rank','Three scores, kept apart: how much it matters, how fast it moves, and whether we can trust it.',body);
}

function barRow(p){
  const pct=Math.round((p.v||0)*100);
  const w=p.w!=null?`<em class="bw" title="how much this factor counts toward the score">${Math.round(p.w*100)}%</em>`:'';
  return `<div class="brow">
    <div class="brhead"><b>${esc(p.name||'')}</b>${w}</div>
    <div class="brbar"><i style="width:${pct}%"></i></div>
    <span class="brsay">${esc(p.say)}</span>
  </div>`;
}

/* The card shows the top 3 factors as bars for readability; this
   names the remaining ones and their weights so the five clearly
   add up to 100%. */
function hiddenFactors(parts){
  const rest=parts.slice(3);
  if(!rest.length) return '';
  return `<p class="morefac">Also counted: ${rest.map(p=>`${esc(p.name)} <b>${Math.round(p.w*100)}%</b>`).join(' &middot; ')} &mdash; weights total 100%.</p>`;
}

/* Map the engine's suggestion (primary/secondary brand) to the
   channel ids that should start out selected. */
function suggestedChannels(R){
  const rt=R.routing;
  const want=new Set();
  const brands=[rt.primary&&rt.primary.name, rt.secondary&&rt.secondary.name].filter(Boolean);
  const tv = rt.tv>=rt.dig;                 // the engine's TV-vs-digital lean
  for(const p of PROPERTIES){
    const brandMatch = brands.includes(p.brand) ||
      (p.brand==='India Today' && brands.includes('India Today TV'));
    if(!brandMatch) continue;
    // give the primary brand both mediums it supports where the lean fits
    if(p.medium==='Digital') want.add(p.id);
    if(p.medium==='TV' && tv) want.add(p.id);
  }
  if(!want.size) want.add('it-dig');        // never leave it empty
  return want;
}
function routeSel(R){
  const id=R.cluster.id;
  if(!S.routeSel[id]) S.routeSel[id]=suggestedChannels(R);
  return S.routeSel[id];
}
function sDecide(R){
  const rt=R.routing, lg=R.ledger;
  const sel=routeSel(R);
  const suggested=suggestedChannels(R);
  const byMedium=m=>PROPERTIES.filter(p=>p.medium===m);
  const chan=p=>{
    const on=sel.has(p.id), sug=suggested.has(p.id);
    return `<button class="chan ${on?'on':''} ${sug?'sug':''}" data-chan="${p.id}" aria-pressed="${on}">
      <span class="cbx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span>
      <span><span class="cnm">${esc(p.brand)}</span><span class="clg">${LANG_NAME[p.lang]}</span></span>
    </button>`;
  };
  const chosen=[...sel].map(id=>PROPERTIES.find(p=>p.id===id)).filter(Boolean);
  const tvNames=[...new Set(chosen.filter(p=>p.medium==='TV').map(p=>p.brand))];
  const digNames=[...new Set(chosen.filter(p=>p.medium==='Digital').map(p=>p.brand))];
  const langs=[...new Set(chosen.map(p=>LANG_NAME[p.lang]))];
  const summary = chosen.length
    ? `Publishing to <b>${chosen.length} channel${chosen.length===1?'':'s'}</b>${tvNames.length?` — on TV: <b>${esc(tvNames.join(', '))}</b>`:''}${digNames.length?`; on digital: <b>${esc(digNames.join(', '))}</b>`:''}. Languages: <b>${esc(langs.join(', '))}</b>.`
    : `Nothing selected yet — pick at least one channel.`;

  const body=`<div class="picker">
    <div class="pickhead"><h4>Where should this story go?</h4><span class="suggested">✓ ${BRAND}'s suggestion is pre-selected</span></div>
    <p class="pickhint">${BRAND} picks the brands, languages and medium that fit this story — here, ${esc(rt.decision.toLowerCase())}. Tap any channel to add or remove it. TV and digital are separate outputs, so a story can run on one, the other, or both.</p>
    <div class="chgrp"><div class="chgrp-h"><svg class="mi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg> On TV</div>
      <div class="chans">${byMedium('TV').map(chan).join('')}</div></div>
    <div class="chgrp"><div class="chgrp-h"><svg class="mi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M3 20h18"/></svg> On digital</div>
      <div class="chans">${byMedium('Digital').map(chan).join('')}</div></div>
    <p class="picksum">${summary}</p>
    ${rt.note?`<p class="routenote">${esc(rt.note)}</p>`:''}
  </div>
  ${lg.gaps.length?`<div class="gapbox"><h4>Before we publish: what rivals have that we haven't confirmed</h4>
    <p class="gapexp">A rival has already published these facts and we haven't stood them up ourselves. We won't print them until we do — but the desk needs to know it's behind, and on what.</p>
    ${lg.gaps.map(g=>`<p class="gaprow"><b>${esc(cap(keyLabel(g.key)))}</b> — ${esc(g.who.join(', '))} ${g.who.length>1?'have':'has'} it; we don't yet.</p>`).join('')}
    </div>`:''}
  ${sPeople(R)}`;
  return stageWrap('decide',4,'Route','Choose the channels and language. See where a rival is ahead.',body);
}

function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

function sPeople(R){
  const primary = (R.routing.primary && R.routing.primary.name) || '';
  const digital = [
    { name:'Dev Goswami', brand:'India Today' },
    { name:'Abhishek Bhattacharya', brand:'Aaj Tak' }
  ];
  const tv = [
    { name:'Kaushlendra Bikram Singh' },
    { name:'Rahul Raj' }
  ];
  const digLead = digital.find(p=>primary.includes(p.brand)) || digital[0];
  return `<div class="deskbox"><h4>Who on the desk should cover it</h4>
    <p class="gapexp">Split by output, so the story reaches the right person fast — a digital reporter to file the copy and a TV reporter for the broadcast. The best fit is picked from where the story is routed.</p>
    <div class="deskcols">
      <div class="deskcol"><div class="dch">Digital</div>
        ${digital.map(p=>`<p class="deskrow ${p===digLead?'top':''}"><b>${esc(p.name)}</b><span>${esc(p.brand)}</span>${p===digLead?'<span class="pickme">best fit</span>':''}</p>`).join('')}
      </div>
      <div class="deskcol"><div class="dch">On TV</div>
        ${tv.map((p,i)=>`<p class="deskrow ${i===0?'top':''}"><b>${esc(p.name)}</b><span>Broadcast desk</span>${i===0?'<span class="pickme">best fit</span>':''}</p>`).join('')}
      </div>
    </div>
  </div>`;
}

function langSelector(){
  return `<div class="langsel"><span class="ll">Draft language</span>${LANGS.map(l=>`<button class="lang ${S.draftLang===l.id?'on':''}" data-lang="${l.id}">${esc(l.label)}</button>`).join('')}</div>`;
}
function sPublish(R){
  const st=S.storyDraft;
  const isThis = st.id===R.cluster.id;
  let body;
  if(!isThis || (!st.data && !st.loading)){
    body=`<div class="publishcta">
      <p>One click grounds a draft: every sentence tied to a source, with the editorial and search fields filled in. Watch it write.</p>
      <button class="btn primary big" data-act="write">Write the story</button>
    </div>`;
  } else if(st.loading){
    body=`<div class="grounding">
      <p class="gline">Reading ${R.cluster.items.length} arrivals…</p>
      <p class="gline">Ranking each fact by how trustworthy the source is…</p>
      <p class="gline">Dropping unverified and rival-only claims…</p>
      <p class="gline">Writing only what a source stands behind…</p>
      <div class="bar"><i></i></div></div>`;
  } else {
    body=draftBody(R.cluster, st.data);
  }
  return stageWrap('publish',5,'Publish','A sourced draft, ready for the CMS. Nothing here publishes itself.',body);
}

function draftBody(c, d){
  const f=d.sentences[S.storyDraft.focus]||d.sentences[0];
  const item=f?c.items.find(x=>x.id===f.itemId)||(c.related||[]).map(r=>r.item).find(x=>x.id===f.itemId):null;
  const cms=S.cms, tv=S.tv||{saving:false,result:null};
  const tvf=d.seo.tv||{headline:'',ticker:'',video:0};

  /* which channels is this story routed to? drives the send options */
  const imp=importance(c,S.graph), urg=urgency(c,S.now,S.graph);
  const R={cluster:c,imp,urg,routing:routing(c,imp,urg)};
  const chosen=[...routeSel(R)].map(id=>PROPERTIES.find(p=>p.id===id)).filter(Boolean);
  const hasTV=chosen.some(p=>p.medium==='TV');
  const hasDig=chosen.some(p=>p.medium==='Digital');
  const tvBrands=[...new Set(chosen.filter(p=>p.medium==='TV').map(p=>p.brand))];
  const digBrands=[...new Set(chosen.filter(p=>p.medium==='Digital').map(p=>p.brand))];

  const destsum = (hasTV||hasDig)
    ? `Routed to ${hasTV?`<b>TV</b> (${esc(tvBrands.join(', '))})`:''}${hasTV&&hasDig?' and ':''}${hasDig?`<b>Digital</b> (${esc(digBrands.join(', '))})`:''} — change it in Route above.`
    : `No channel selected in Route above — pick at least one to send.`;

  const tvBtn = tv.result
    ? `<div class="cmsdone tv"><b>Queued for TV · ${esc(tv.result.id)}</b><span>on the rundown, not on air</span></div>`
    : tv.saving ? `<button class="btn primary wide" disabled>Sending to TV…</button>`
    : `<button class="btn primary wide" data-act="tv">Send to TV rundown</button>`;
  const digBtn = cms.result
    ? `<div class="cmsdone"><b>Saved · ${esc(cms.result.id)}</b><span>digital draft, never live</span></div>`
    : cms.saving ? `<button class="btn ${hasTV?'':'primary'} wide" disabled>Saving…</button>`
    : `<button class="btn ${hasTV?'':'primary'} wide" data-act="cms">Save digital draft to CMS</button>`;

  return `<div class="draftwrap">
    <div class="draftmain">
      ${d.gates.length?`<div class="gates"><h4>Blocked until a person clears these</h4>${d.gates.map(g=>`<p>${esc(g)}</p>`).join('')}</div>`:''}
      <div class="copy">${d.sentences.map((s,i)=>`<span class="sent ${i===S.storyDraft.focus?'on':''}" data-sent="${i}" tabindex="0" role="button">${esc(s.text)}<sup>${esc(s.sourceLabel)}</sup></span> `).join('')}</div>
      ${d.holdBack.length?`<div class="holdback"><h4>Held back until we confirm it ourselves</h4><p class="hbexp">These facts came from rivals or unverified accounts. They stay out of the copy until our own reporting stands them up.</p>${d.holdBack.slice(0,3).map(h=>`<p>${esc(h)}</p>`).join('')}</div>`:''}
      <div class="seo"><h4>Editorial and search fields, filled in</h4>
        <div class="fldgrp"><span class="fgl">Digital &amp; search</span>
          <dl>
            <dt>Search headline</dt><dd>${esc(d.seo.seoHeadline)}</dd>
            <dt>Social headline</dt><dd>${esc(d.seo.social)}</dd>
            <dt>Slug</dt><dd class="mono">${esc(d.seo.slug)}</dd>
            <dt>Tags</dt><dd>${d.seo.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</dd>
            <dt>Internal links</dt><dd>${d.seo.internal.length?d.seo.internal.map(l=>esc(l.title)).join('<br>'):'none'}</dd>
          </dl>
        </div>
        <div class="fldgrp"><span class="fgl">TV / broadcast</span>
          <dl>
            <dt>TV headline <em>(lower-third)</em></dt><dd class="tvsuper">${esc(tvf.headline)}</dd>
            <dt>Ticker</dt><dd class="mono">${esc(tvf.ticker)}</dd>
            <dt>Package video</dt><dd>${tvf.video?`${tvf.video} usable clip${tvf.video===1?'':'s'} on the tape`:'no usable video yet — TV can’t lead on this'}</dd>
          </dl>
        </div>
      </div>
    </div>
    <aside class="draftside">
      <div class="prov"><h4>Where this sentence came from</h4>
        ${f?`<p class="provsrc"><span class="tsrc s${item?item.src.tier:1}">${esc(f.sourceLabel)}</span><span class="rights">${esc(f.rights)}</span></p>
          <blockquote>${esc(f.snippet)}</blockquote>`:'<p>—</p>'}
        <p class="provnote">Click any sentence to trace it. A sentence with no source is never written.</p>
      </div>
      <div class="senddest">${destsum}</div>
      ${hasTV?tvBtn:''}
      ${hasDig?digBtn:''}
      ${(!hasTV&&!hasDig)?`<button class="btn primary wide" disabled>Select a channel in Route</button>`:''}
      <p class="nopub">Nothing goes live here — TV queues to the rundown, digital saves as a draft. The desk presses publish.</p>
    </aside>
  </div>`;
}

/* ============================================================
   EVENTS
   ============================================================ */
function openStory(id){
  S.storyId=id; S.view='story';
  S.storyDraft={id:null,loading:false,data:null,focus:0}; S.cms={saving:false,result:null}; S.tv={saving:false,result:null};
  S.draftLang='en';
  render();
}

function writeDraft(){
  const c=curStory(); if(!c) return;
  const lang=S.draftLang;
  S.storyDraft={ id:c.id, loading:true, data:null, focus:0 };
  S.cms={saving:false,result:null}; S.tv={saving:false,result:null}; render();
  NewsHuntAPI.generateDraft(c, lang).then(d=>{ if(S.view!=='story'||S.storyId!==c.id) return;
    S.storyDraft={ id:c.id, loading:false, data:d, focus:0 }; render(); });
}

function changeLang(lang){
  S.draftLang=lang;
  const c=curStory(), st=S.storyDraft;
  if(c && st.id===c.id && st.data && !st.loading){ writeDraft(); }  // regenerate in the new language
  else render();
}

function toggleChannel(pid){
  const c=curStory(); if(!c) return;
  const imp=importance(c,S.graph), urg=urgency(c,S.now,S.graph);
  const R={cluster:c,imp,urg,routing:routing(c,imp,urg)};
  const sel=routeSel(R);
  if(sel.has(pid)) sel.delete(pid); else sel.add(pid);
  render();
}

function toggleTheme(){
  S.theme = S.theme==='dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = S.theme;
  render();
}
function saveCms(){
  const c=curStory(), d=S.storyDraft.data; if(!c||!d) return;
  const payload={ target:'digital', status:'draft', autoPublish:false, headline:d.seo.display,
    seoHeadline:d.seo.seoHeadline, socialHeadline:d.seo.social, slug:d.seo.slug,
    metaDescription:d.seo.metaDesc, tags:d.seo.tags, internalLinks:d.seo.internal,
    body:d.sentences.map(s=>({text:s.text, source:s.sourceLabel, sourceItem:s.itemId, rights:s.rights})),
    editorialGates:d.gates, confidence:d.confidence, clusterId:c.id };
  S.cms={saving:true,result:null}; render();
  NewsHuntAPI.saveDraft(payload).then(res=>{ S.cms={saving:false,result:res}; render(); });
}
function sendTv(){
  const c=curStory(), d=S.storyDraft.data; if(!c||!d) return;
  const tvf=d.seo.tv||{};
  const payload={ target:'tv', status:'queued', autoAir:false,
    tvHeadline:tvf.headline, ticker:tvf.ticker, hasVideo:(tvf.video||0)>0,
    body:d.sentences.map(s=>({text:s.text, source:s.sourceLabel, sourceItem:s.itemId, rights:s.rights})),
    editorialGates:d.gates, confidence:d.confidence, clusterId:c.id };
  S.tv={saving:true,result:null}; render();
  NewsHuntAPI.sendToTv(payload).then(res=>{ S.tv={saving:false,result:res}; render(); });
}

document.addEventListener('click', e=>{
  const t=e.target.closest('[data-act],[data-view],[data-stage],[data-open],[data-sent],[data-lang],[data-chan]');
  if(!t) return;
  if(t.dataset.act){
    const a=t.dataset.act;
    if(a==='play') play();
    if(a==='pause') pause();
    if(a==='closestage'){ S.openStage=null; render(); }
    if(a==='write') writeDraft();
    if(a==='cms') saveCms();
    if(a==='tv') sendTv();
    if(a==='theme') toggleTheme();
    return;
  }
  if(t.dataset.lang){ changeLang(t.dataset.lang); return; }
  if(t.dataset.chan){ toggleChannel(t.dataset.chan); return; }
  if(t.dataset.view){ S.view=t.dataset.view; if(t.dataset.view==='overview') S.storyId=null; render(); return; }
  if(t.dataset.stage){ S.openStage = S.openStage===t.dataset.stage ? null : t.dataset.stage; render(); return; }
  if(t.dataset.open){ openStory(t.dataset.open); return; }
  if(t.dataset.sent){ S.storyDraft.focus=+t.dataset.sent; render(); return; }
});

document.addEventListener('keydown', e=>{
  if((e.key==='Enter'||e.key===' ')){ const t=e.target.closest('[data-open],[data-sent],[data-chan],[data-lang]');
    if(t){ e.preventDefault(); t.click(); } }
  if(e.key==='Escape'){ if(S.openStage){ S.openStage=null; render(); }
    else if(S.view==='story'){ S.view='overview'; S.storyId=null; render(); } }
});

document.addEventListener('input', e=>{
  if(e.target.classList.contains('scrub')){ const v=+e.target.value; pause();
    v<S.now?rebuild(v):advanceTo(v); render(); }
});

/* ---------- boot ---------- */
async function boot(){
  document.documentElement.dataset.theme = S.theme;   // default light; user can toggle
  render();
  const [feeds,archive,tape,desk,trends]=await Promise.all([
    NewsHuntAPI.fetchFeeds(), NewsHuntAPI.fetchArchive(),
    NewsHuntAPI.fetchTape(), NewsHuntAPI.fetchDesk(), NewsHuntAPI.fetchTrends()
  ]);
  FEEDS=feeds; ARCHIVE=archive; TAPE=tape; DESK=desk; S.trends=trends;
  END=TAPE[TAPE.length-1].t+60; OPEN_AT=END;
  rebuild(OPEN_AT); S.ready=true; render();
}
boot();
})();
</script>
</body>
